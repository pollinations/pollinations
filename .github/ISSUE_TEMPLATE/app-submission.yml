name: Submit an app
description: Submit a Pollinations-powered app for the community catalog
title: "[App Submission] "
labels: [APP-SUBMISSION]
body:
  - type: markdown
    attributes:
      value: |
        ## Submit your app

        - **App:** working, with a clear purpose and visible use of Pollinations.

        - **Access:** a public app URL, repository, or both.

        - **Screenshot:** your app's real screen; see the upload requirements below.

        - **Credit:** add the badge or site link as described at the end of this form.

        - **Content:** no spam, scams, or deceptive behavior.

        <br>

        Automated pre-review → maintainer review → community catalog.

        <br>

  - type: input
    id: app-name
    attributes:
      label: App Name
      placeholder: Sunflower Studio
    validations:
      required: true

  - type: textarea
    id: app-description
    attributes:
      label: App Description
      description: Briefly explain what the app does and how it uses Pollinations.
      placeholder: Creates collaborative images using the Pollinations image API.
    validations:
      required: true

  - type: input
    id: app-url
    attributes:
      label: App URL
      description: Public URL where people can try the app. Leave empty when the repository is the app, such as a plugin or library.
      placeholder: https://example.com

  - type: input
    id: github-repo
    attributes:
      label: GitHub Repository URL
      description: Public source repository. Required when there is no App URL.
      placeholder: https://github.com/username/repository

  - type: markdown
    attributes:
      value: |
        <br>

        ### Catalog listing

  - type: upload
    id: screenshot
    attributes:
      label: Screenshot
      description: "The app's real screen, not a logo or banner. PNG, JPEG, or WebP, at most 5 MB, 16:9 landscape, at least 1280×720. Keep the key content in the top half; the catalog crops from the top. Mobile apps: place the phone screen on a 16:9 canvas."
    validations:
      required: true
      accept: ".png,.jpg,.jpeg,.webp"

  - type: dropdown
    id: app-category
    attributes:
      label: App Category
      options:
        - image
        - video_audio
        - writing
        - chat
        - games
        - learn
        - bots
        - build
        - business
    validations:
      required: true

  - type: dropdown
    id: app-platform
    attributes:
      label: Platform
      description: Where people use the app. Windows and macOS apps, and plugins for desktop software such as Krita or Obsidian, are desktop.
      options:
        - web
        - android
        - ios
        - desktop
        - cli
        - discord
        - telegram
        - browser-ext
        - library
        - api
    validations:
      required: true

  - type: input
    id: app-language
    attributes:
      label: App Language
      description: ISO language code.
      value: en
    validations:
      required: true

  - type: markdown
    attributes:
      value: |
        <br>

        ### Optional details

  - type: input
    id: discord-contact
    attributes:
      label: Discord Username
      description: Optional contact username.

  - type: input
    id: quest
    attributes:
      label: Quest
      description: Leave empty unless you built this app for a POLLEN-QUEST issue. Enter the quest number; approving the app completes the quest and pays you its reward.
      placeholder: "#15600"

  - type: markdown
    attributes:
      value: |
        <br>

        ## Credit Pollinations

        [![Made with pollinations.ai](https://raw.githubusercontent.com/pollinations/pollinations/123ed07456106a4f752c0a22c584e8cadd2db6a8/packages/ui/src/brand/badge-made-with.svg)](https://pollinations.ai/?ref=badge)

        - **With a repository:** add the badge to your README.

        - **Without a repository:** show the badge or a visible [pollinations.ai](https://pollinations.ai) link on the app page.

        <br>

        **README — copy this Markdown:**

        ```markdown
        [![Made with pollinations.ai](https://raw.githubusercontent.com/pollinations/pollinations/main/packages/ui/src/brand/badge-made-with.svg)](https://pollinations.ai/?ref=badge)
        ```

        <br>

        **App page — copy this HTML:**

        ```html
        <a href="https://pollinations.ai/?ref=badge">
          <img
            src="https://raw.githubusercontent.com/pollinations/pollinations/main/packages/ui/src/brand/badge-made-with.svg"
            alt="Made with pollinations.ai"
          >
        </a>
        ```
