name: Balance Problem
description: Balance not showing after a top-up
title: "Balance: "
body:
  - type: input
    id: email
    attributes:
      label: Email
      description: The email you used to sign up
      placeholder: "your@email.com"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      placeholder: "e.g., Topped up $20 30 min ago, balance still shows $0"
    validations:
      required: true
