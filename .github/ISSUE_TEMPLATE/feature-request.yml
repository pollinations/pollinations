name: Feature Request
description: Suggest a feature. If a merged PR builds it, you earn 2 Quest Pollen.
title: "Feature: "
body:
  - type: markdown
    attributes:
      value: |
        When a merged pull request closes this issue, you earn 2 Quest Pollen. Claim them on the [Quests page](https://enter.pollinations.ai/quests) while signed in with this GitHub account.

  - type: textarea
    id: feature
    attributes:
      label: What should Pollinations do?
      placeholder: "e.g., Let /v1/models filter by input type"
    validations:
      required: true

  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      description: What you are building, or what is hard today without it.
