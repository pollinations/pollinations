name: Models / Research billing audit
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    if: github.ref == 'refs/heads/codex/model-researcher-e2e'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - name: Read stopped research total only
        env:
          POLLINATIONS_API_KEY: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
          RESEARCH_OUT: ${{ runner.temp }}/model-billing-audit
        run: node temp/audit-research-billing.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: model-billing-audit
          path: ${{ runner.temp }}/model-billing-audit/
