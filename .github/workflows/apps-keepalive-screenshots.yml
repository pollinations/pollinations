name: Models / Research pre-merge E2E

on:
  workflow_dispatch:
    inputs:
      evidence_run:
        description: 'Validation only: reuse completed live research from this run ID.'
        type: string
        default: ''
      models:
        description: 'Official canonical IDs or aliases, comma separated. Empty = full backfill.'
        type: string
        default: ''
      max_pollen:
        description: 'Maximum reserved Pollen for inference and search (0 < budget <= 50).'
        type: string
        default: '15'
      publish_issue:
        description: 'Create the parent research issue. Disable for a smoke test.'
        type: boolean
        default: true
      use_perplexity:
        description: 'Opt in to paid Perplexity search as a second opinion; Exa remains the default.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: model-research
  cancel-in-progress: false

jobs:
  researcher:
    if: github.ref == 'refs/heads/codex/model-researcher-e2e'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Scrapling fetcher
        run: python -m pip install 'scrapling[fetchers]==0.4.15'
      - name: Validate researcher
        env:
          RUN_LIVE_FETCH: '1'
        run: node --test operations/model-management/*.test.mjs
      - name: Load saved live research for publisher validation
        if: inputs.evidence_run != ''
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.evidence_run }}
          name: model-research-${{ inputs.evidence_run }}-1
          path: ${{ runner.temp }}/model-research
      - name: Research official catalog and market (GPT-6.1 Sol, medium effort)
        if: inputs.evidence_run == ''
        env:
          POLLINATIONS_API_KEY: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
          MODELS: ${{ inputs.models }}
          MAX_POLLEN: ${{ inputs.max_pollen }}
          USE_PERPLEXITY: ${{ inputs.use_perplexity }}
          RESEARCH_OUT: ${{ runner.temp }}/model-research
        run: node operations/model-management/researcher.mjs
      - name: Save findings and partial evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-research/
          if-no-files-found: error
          retention-days: 14
      - name: Publish parent issue for manual verification handoff
        id: parent
        if: always() && inputs.publish_issue && steps.evidence.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RESEARCH_OUT: ${{ runner.temp }}/model-research
          RESEARCH_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node operations/model-management/researcher.mjs publish
      - name: Save parent publication receipt and uncertain writes
        if: always() && inputs.publish_issue && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: model-research-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-research/parent-*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Reconcile the same parent a second time
        if: always() && inputs.publish_issue && steps.parent.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RESEARCH_OUT: ${{ runner.temp }}/model-research
          RESEARCH_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          cp "$RESEARCH_OUT/parent-issue.json" "$RUNNER_TEMP/first-parent.json"
          node operations/model-management/researcher.mjs publish
          cmp "$RUNNER_TEMP/first-parent.json" "$RESEARCH_OUT/parent-issue.json"
      - name: Verify complete saved live results
        if: always() && steps.evidence.outcome == 'success'
        env:
          RESEARCH_OUT: ${{ runner.temp }}/model-research
          RESEARCH_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile} from 'node:fs/promises';
          import {createHash} from 'node:crypto';
          import {parentIssue} from './operations/model-management/researcher.mjs';
          const r=JSON.parse(await readFile(process.env.RESEARCH_OUT+'/research.json','utf8'));
          assert.equal(r.status,'complete');
          assert.equal(r.selectedCount,2);
          assert.ok(r.reservedPollen<=r.maxPollen);
          assert.ok(r.calls.every(c=>c.status==='received'));
          assert.ok(r.models.every(m=>m.status==='researched' && ['azure','fireworks','bedrock','alternatives'].every(s=>m.searches.some(q=>q.scope===s))));
          assert.ok(r.models.flatMap(m=>m.routes).every(x=>x.runtimeVerified===false && x.creditEligibility==='unknown' && x.cashCost===null));
          const sources=[...r.discovery.sources,...r.models.flatMap(m=>m.sources)];
          assert.ok(sources.filter(s=>s.status==='fetched').every(s=>s.digest===createHash('sha256').update(s.text).digest('hex')));
          const issue=parentIssue(r,process.env.RESEARCH_ARTIFACT_URL);
          assert.ok(issue.body.split('\n').every(line=>line.startsWith('- ')));
          console.log(JSON.stringify({status:r.status,selected:r.models.map(m=>m.name),calls:r.calls.length,reservedPollen:r.reservedPollen,sources:sources.length,focused:sources.filter(s=>s.focusMatched===true).length}));
          JS
