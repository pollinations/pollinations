name: Apps / Manage catalog

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Screenshot set to process
        type: choice
        options:
          - refresh
          - missing
          - all
        default: missing
      limit:
        description: Maximum screenshots for a manual run
        type: number
        default: 50

concurrency:
  group: app-catalog-management
  cancel-in-progress: false

jobs:
  manage-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright-core install --with-deps chromium

      - name: Capture and upload screenshots
        env:
          COMMUNITY_APP_MANAGEMENT_KEY: ${{ secrets.COMMUNITY_APP_MANAGEMENT_KEY }}
          COMMUNITY_APP_REVIEW_AUTH_STATE: ${{ secrets.COMMUNITY_APP_REVIEW_AUTH_STATE }}
          CAPTURE_MODE: ${{ inputs.mode || 'refresh' }}
          CAPTURE_LIMIT: ${{ inputs.limit }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          AUTH_STATE_PATH="$RUNNER_TEMP/community-app-review-auth-state.json"
          if [[ -z "$COMMUNITY_APP_REVIEW_AUTH_STATE" ]]; then
            echo "COMMUNITY_APP_REVIEW_AUTH_STATE is not configured" >&2
            exit 1
          fi
          printf '%s' "$COMMUNITY_APP_REVIEW_AUTH_STATE" > "$AUTH_STATE_PATH"
          chmod 600 "$AUTH_STATE_PATH"
          trap 'rm -f "$AUTH_STATE_PATH"' EXIT

          if [[ "$IS_SCHEDULED" == "true" ]]; then
            args=(--mode=all --limit=50 --rotate-daily --concurrency=4 --publish)
          else
            args=(--mode="$CAPTURE_MODE" --concurrency=4 --publish)
            args+=(--limit="${CAPTURE_LIMIT:-50}")
          fi
          args+=(--auth-state="$AUTH_STATE_PATH" --authorize-pollinations)
          npm run apps:capture-screenshots -- "${args[@]}"

      - name: Finalize catalog
        run: |
          if ! git diff --quiet -- apps/catalog.json; then
            node apps/app-management/generate-catalog-outputs.js
          fi

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-management-evidence
          path: |
            temp/app-screenshots/**/report.json
            temp/app-screenshots/**/evidence/*.png
          if-no-files-found: warn
          retention-days: 30

      - name: Check for catalog changes
        id: changes
        run: |
          REPORT=$(find temp/app-screenshots -name report.json -type f | sort | tail -1)
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- apps/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate repository write token
        if: steps.changes.outputs.changed == 'true'
        id: pollinations-ai
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}

      - name: Configure git
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
        run: |
          git config user.name "pollinations-ai[bot]"
          git config user.email "pollinations-ai[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Create refresh PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
          REPORT: ${{ steps.changes.outputs.report }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/app-screenshots-${DATE}-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH"
          git add apps/catalog.json apps/GREENHOUSE.md README.md
          git commit -m "chore: maintain community apps (${DATE})"
          git push -u origin "$BRANCH"

          RUN_URL="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          node apps/app-management/management/render-pr-body.js \
            "$REPORT" "$RUN_URL" > "$RUNNER_TEMP/pr-body.md"

          PR_URL=$(gh pr create \
            --title "chore: maintain community apps (${DATE})" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
