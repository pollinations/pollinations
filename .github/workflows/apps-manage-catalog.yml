name: Apps / Manage catalog

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: Screenshot set to process
        type: choice
        options:
          - refresh
          - missing
          - all
        default: missing
      limit:
        description: Maximum screenshots for a manual run
        type: number
        default: 50

concurrency:
  group: app-catalog-management
  cancel-in-progress: false

jobs:
  manage-catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: |
          npm ci --ignore-scripts
          npx playwright-core install --with-deps chromium

      - name: Capture and upload screenshots
        env:
          COMMUNITY_APP_MANAGEMENT_KEY: ${{ secrets.COMMUNITY_APP_MANAGEMENT_KEY }}
          CAPTURE_MODE: ${{ inputs.mode || 'refresh' }}
          CAPTURE_LIMIT: ${{ inputs.limit }}
          IS_SCHEDULED: ${{ github.event_name == 'schedule' }}
        run: |
          if [[ "$IS_SCHEDULED" == "true" ]]; then
            args=(--mode=all --limit=50 --rotate-daily --concurrency=4 --publish)
          else
            args=(--mode="$CAPTURE_MODE" --concurrency=4 --publish)
            args+=(--limit="${CAPTURE_LIMIT:-50}")
          fi
          npm run apps:capture-screenshots -- "${args[@]}"

      - name: Finalize catalog
        run: |
          if ! git diff --quiet -- apps/catalog.json; then
            node apps/operation/app-management/generate-catalog-outputs.js
          fi

      - name: Upload capture report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-screenshot-report
          path: temp/app-screenshots/**/report.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check for catalog changes
        id: changes
        run: |
          REPORT=$(find temp/app-screenshots -name report.json -type f | sort | tail -1)
          echo "report=$REPORT" >> "$GITHUB_OUTPUT"
          if git diff --quiet -- apps/catalog.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate repository write token
        if: steps.changes.outputs.changed == 'true'
        id: pollinations-ai
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}

      - name: Configure git
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
        run: |
          git config user.name "pollinations-ai[bot]"
          git config user.email "pollinations-ai[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Create refresh PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
          REPORT: ${{ steps.changes.outputs.report }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="auto/app-screenshots-${DATE}-${GITHUB_RUN_ID}"

          git checkout -b "$BRANCH"
          git add apps/catalog.json apps/GREENHOUSE.md README.md
          git commit -m "chore: maintain community apps (${DATE})"
          git push -u origin "$BRANCH"

          REMOVAL_COUNT=$(jq '.removedApps | length' "$REPORT")
          if [ "$REMOVAL_COUNT" -gt 0 ]; then
            REMOVALS=$(jq -c '.removedApps' "$REPORT")
            MARKER=$(printf '{"action":"remove","apps":%s}' "$REMOVALS" | base64 -w0)
            REMOVAL_LIST=$(jq -r '.removedApps[] | "- **\(.name)** — \(.reason)"' "$REPORT")
          else
            MARKER=""
            REMOVAL_LIST="- None"
          fi
          MARKER_LINE=""
          if [ -n "$MARKER" ]; then
            MARKER_LINE="<!-- pollinations-app-management:${MARKER} -->"
          fi

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          - Refreshes approved community-app screenshots.
          - Removes only apps with a confirmed permanent failure.
          - [Capture report](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})

          Removed apps:
          ${REMOVAL_LIST}

          ${MARKER_LINE}
          EOF

          PR_URL=$(gh pr create \
            --title "chore: maintain community apps (${DATE})" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
