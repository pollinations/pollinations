name: Apps / Publish approved submission

on:
  issues:
    types: [labeled]

concurrency:
  group: app-publish-submissions
  queue: max
  cancel-in-progress: false

jobs:
  publish:
    if: |
      github.event.issue.state == 'open' &&
      github.event.label.name == 'APP-APPROVED' &&
      contains(github.event.issue.labels.*.name, 'APP-SUBMISSION')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}

      - name: Get bot identity
        id: bot
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          BOT_LOGIN="${{ steps.token.outputs.app-slug }}[bot]"
          BOT_ID=$(gh api "/users/${BOT_LOGIN}" --jq .id)
          echo "login=$BOT_LOGIN" >> "$GITHUB_OUTPUT"
          echo "id=$BOT_ID" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        id: checkout
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          check-latest: true
          package-manager-cache: false

      - name: Install screenshot dependency
        run: |
          npm install --prefix "$RUNNER_TEMP/sharp" --no-audit --no-fund sharp@0.34.5
          echo "NODE_PATH=$RUNNER_TEMP/sharp/node_modules" >> "$GITHUB_ENV"

      - name: Revalidate approved submission
        id: app
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          POLLINATIONS_API_KEY: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
        run: bash operations/app-management/ingestion/run-publication.sh prepare

      - name: Add app to catalog
        id: branch
        env:
          APP_JSON: ${{ steps.app.outputs.app }}
          APP_NAME: ${{ steps.app.outputs.name }}
          APP_CATEGORY: ${{ steps.app.outputs.category }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          USER_ID: ${{ steps.app.outputs.user_id }}
          FIXES: ${{ steps.app.outputs.fixes }}
          BOT_LOGIN: ${{ steps.bot.outputs.login }}
          BOT_ID: ${{ steps.bot.outputs.id }}
        run: bash operations/app-management/ingestion/run-publication.sh catalog

      - name: Open and queue catalog PR
        id: pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          APP_NAME: ${{ steps.app.outputs.name }}
          APP_CATEGORY: ${{ steps.app.outputs.category }}
          APP_URL: ${{ steps.app.outputs.url }}
          APP_DESCRIPTION: ${{ steps.app.outputs.description }}
          BRANCH: ${{ steps.branch.outputs.name }}
          FIXES: ${{ steps.app.outputs.fixes }}
        run: bash operations/app-management/ingestion/run-publication.sh queue

      - name: Wait for merge before publishing the next app
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: bash operations/app-management/ingestion/run-publication.sh wait

      - name: Remove review label
        if: success() && contains(github.event.issue.labels.*.name, 'APP-REVIEW')
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label APP-REVIEW

      - name: Recover failed publication
        if: failure() && steps.checkout.outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: bash operations/app-management/ingestion/run-publication.sh recover

      # Checkout can fail before the recovery script is available. Return the issue
      # to review so a maintainer can retry approval.
      - name: Return submission to review after setup failure
        if: failure() && steps.checkout.outcome != 'success' && steps.token.outputs.token != ''
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --remove-label APP-APPROVED --remove-label APP-NEEDS-INFO --add-label APP-REVIEW
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "Automated app publication could not start. The issue was moved back to \`APP-REVIEW\`. [View the failed workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
