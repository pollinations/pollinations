name: Apps / Reactivate fixed app

on:
  issue_comment:
    types: [created]

concurrency:
  group: app-reactivation-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  reactivate:
    if: |
      !github.event.issue.pull_request &&
      contains(github.event.issue.labels.*.name, 'APP-SUBMISSION') &&
      github.event.comment.user.type != 'Bot' &&
      (github.event.comment.user.login == github.event.issue.user.login ||
       contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.token.outputs.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Interpret the reply and recover the catalog row
        id: candidate
        env:
          COMMUNITY_APP_MANAGEMENT_KEY: ${{ secrets.COMMUNITY_APP_MANAGEMENT_KEY }}
        run: |
          node apps/operation/app-management/management/reactivate-app.js prepare \
            --event="$GITHUB_EVENT_PATH" \
            --output="$RUNNER_TEMP/app-candidate.json"
          if [ -f "$RUNNER_TEMP/app-candidate.json" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install browser
        if: steps.candidate.outputs.ready == 'true'
        run: |
          npm ci --ignore-scripts
          npx playwright-core install --with-deps chromium

      - name: Recheck app and capture a fresh screenshot
        if: steps.candidate.outputs.ready == 'true'
        env:
          COMMUNITY_APP_MANAGEMENT_KEY: ${{ secrets.COMMUNITY_APP_MANAGEMENT_KEY }}
        run: |
          node apps/operation/app-management/management/reactivate-app.js apply \
            --candidate="$RUNNER_TEMP/app-candidate.json"
          jq -c '[.url]' "$RUNNER_TEMP/app-candidate.json" > "$RUNNER_TEMP/app-target.json"
          npm run apps:capture-screenshots -- \
            --mode=all \
            --targets-file="$RUNNER_TEMP/app-target.json" \
            --limit=1 \
            --concurrency=1 \
            --publish

      - name: Verify reactivation
        if: steps.candidate.outputs.ready == 'true'
        id: verified
        run: |
          REPORT=$(find temp/app-screenshots -name report.json -type f | sort | tail -1)
          if jq -e '.results | length == 1 and .[0].outcome == "approved"' "$REPORT" >/dev/null; then
            node apps/operation/app-management/generate-catalog-outputs.js
            echo "approved=true" >> "$GITHUB_OUTPUT"
          else
            git restore apps/catalog.json
            echo "approved=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create restoration PR
        if: steps.verified.outputs.approved == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          ISSUE_NUMBER="${{ github.event.issue.number }}"
          NAME=$(jq -r .name "$RUNNER_TEMP/app-candidate.json")
          ISSUE_URL=$(jq -r .issueUrl "$RUNNER_TEMP/app-candidate.json")
          URL=$(jq -r .url "$RUNNER_TEMP/app-candidate.json")
          APPS=$(jq -c '[{name, issueUrl}]' "$RUNNER_TEMP/app-candidate.json")
          MARKER=$(printf '{"action":"restore","apps":%s}' "$APPS" | base64 -w0)
          BRANCH="auto/app-restore-${ISSUE_NUMBER}-${GITHUB_RUN_ID}"

          git config user.name "pollinations-ai[bot]"
          git config user.email "pollinations-ai[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add apps/catalog.json apps/GREENHOUSE.md README.md
          git commit -m "chore: restore ${NAME}"
          git push origin "$BRANCH"

          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          - Restores [${NAME}](${URL}) after a fresh app and screenshot review.
          - Responds to ${ISSUE_URL}.

          <!-- pollinations-app-management:${MARKER} -->
          EOF

          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: restore ${NAME}" \
            --body-file "$RUNNER_TEMP/pr-body.md")
          gh pr merge "$PR_URL" --auto --squash --delete-branch
