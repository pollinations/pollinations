name: Apps / Pre-review submissions

on:
  issues:
    types: [opened, edited]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to process
        required: true
        type: number
      dry_run:
        description: Only log the review, even for an invalid form; post nothing
        type: boolean
        default: false

concurrency:
  group: app-pre-review-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: true

jobs:
  # Reads untrusted pages and repositories, so it holds no write token.
  review:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.state == 'open' &&
       (contains(github.event.issue.labels.*.name, 'APP-SUBMISSION') ||
        startsWith(github.event.issue.title, '[App Submission]')) &&
       !contains(github.event.issue.labels.*.name, 'APP-APPROVED'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: read
    outputs:
      number: ${{ steps.issue.outputs.number }}
      validation: ${{ steps.validate.outputs.result }}
      review: ${{ steps.agent.outputs.result }}

    steps:
      - name: Resolve issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
        run: |
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"
          echo "author=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}" --jq .user.login)" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          check-latest: true

      - name: Install screenshot dependency
        run: bash operations/app-management/ingestion/run-review.sh install-screenshot

      - name: Validate submission
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
          ISSUE_AUTHOR: ${{ steps.issue.outputs.author }}
        run: bash operations/app-management/ingestion/run-review.sh validate

      # The agent runs in a container without secrets or private networks. The
      # key stays in the proxy on this host, which the container can call but not read.
      - name: Review with an agent
        id: agent
        if: inputs.dry_run || fromJSON(steps.validate.outputs.result).valid
        timeout-minutes: 12
        env:
          POLLINATIONS_API_KEY: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
        run: bash operations/app-management/ingestion/run-review.sh review

  post:
    needs: review
    if: ${{ !cancelled() && needs.review.result != 'skipped' && !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Generate app token
        id: token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install poster dependency
        run: pip install requests

      - name: Post review
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          ISSUE_NUMBER: ${{ needs.review.outputs.number }}
          VALIDATION_RESULT: ${{ needs.review.outputs.validation }}
          BOT_LOGIN: ${{ steps.token.outputs.app-slug }}[bot]
          REVIEW_RESULT: ${{ needs.review.outputs.review }}
        run: bash operations/app-management/ingestion/run-review.sh post
