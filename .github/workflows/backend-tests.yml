name: Backend Tests

on:
  pull_request:
    paths:
      - 'text.pollinations.ai/**'
      - 'image.pollinations.ai/**'
      - 'shared/**'
      - '.github/workflows/backend-tests.yml'

jobs:
  text-cache-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: text.pollinations.ai/cloudflare-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: text.pollinations.ai/cloudflare-cache/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  image-cache-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: image.pollinations.ai/cloudflare-cache
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: image.pollinations.ai/cloudflare-cache/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
