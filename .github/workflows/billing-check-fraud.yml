name: Billing / Daily Stripe report

on:
  schedule:
    # Daily, not hourly. The confirmed signals this job needs arrive a median of
    # 99 days (disputes) and 121 days (early fraud warnings) after the charge,
    # so scanning every hour re-reads the whole history for evidence that has
    # not moved. Webhooks are the route to faster detection, not polling.
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: billing-fraud-bans
  cancel-in-progress: false

jobs:
  check:
    # Manual review during policy calibration; no automatic enforcement.
    if: github.repository == 'pollinations/pollinations'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v5
        with:
          ref: production
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - uses: nhedger/setup-sops@v3
      - name: Scan Stripe history for manual review
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MYCELI }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_MYCELI }}
          FRAUD_BAN_EXCLUDED_USER_IDS: ${{ vars.FRAUD_BAN_EXCLUDED_USER_IDS }}
          # Private operators' channel; candidate identities never reach public logs.
          DISCORD_FRAUD_WEBHOOK_URL: ${{ secrets.DISCORD_FRAUD_WEBHOOK_URL }}
        run: >-
          sops exec-file --no-fifo enter.pollinations.ai/secrets/prod.vars.json
          'node enter.pollinations.ai/scripts/check-fraud-bans.mjs --secrets-file {}'
