name: CI / llm-pollinations

"on":
  pull_request:
    branches: [main]
    paths:
      - "packages/llm-pollinations/**"
      - ".github/workflows/ci-llm-pollinations.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test llm-pollinations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/llm-pollinations

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install
        run: python -m pip install ".[test]" build

      - name: Test
        run: python -m pytest

      - name: Build distributions
        run: python -m build
