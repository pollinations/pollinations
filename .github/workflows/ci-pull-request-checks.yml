name: CI / Pull request checks

"on":
  pull_request:
    branches: [main, master]
  merge_group:

permissions:
  contents: read

# HEAD is the pull request merge commit, or in the merge queue this pull
# request's squashed commit. With fetch-depth 2 its first parent (HEAD^1) is the
# base branch tip or the queue entry ahead, so `git diff HEAD^1 HEAD` is the
# pull request diff without fetching the full repository history.

jobs:
  project-manager:
    name: Test PR classification and gist enrichment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - name: Check for project manager changes
        id: changes
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- operations/github operations/social/scripts operations/social/prompts operations/app-management/ingestion .github/workflows/ci-pull-request-checks.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v6
        if: steps.changes.outputs.changed == 'true'
        with:
          python-version: '3.11'
      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: pip install requests pyyaml
      - name: Test PR classification and gist enrichment
        if: steps.changes.outputs.changed == 'true'
        run: python3 -m unittest operations/github/test_project_manager.py operations/social/scripts/test_news.py operations/app-management/ingestion/test_review_agent.py

  gpu-tunnels:
    name: Test GPU tunnel recovery
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for GPU or workflow changes
        id: changes
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- operations/infrastructure/gpu .github/workflows/ci-pull-request-checks.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check GPU setup shell syntax
        if: steps.changes.outputs.changed == 'true'
        run: |
          for script in operations/infrastructure/gpu/watch-tunnel.sh operations/infrastructure/gpu/*/setup-vast.sh; do
            bash -n "$script" || exit
          done

      - name: Test tunnel watchdog thresholds and process isolation
        if: steps.changes.outputs.changed == 'true'
        run: python3 -m unittest operations/infrastructure/gpu/test_tunnel_watchdog.py

  lint:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate app catalog
        run: node operations/app-management/app.js validate

      - name: Get changed files
        id: changed-files
        run: |
          # Get only added/modified files (exclude deleted files)
          # Also exclude paths that biome.jsonc ignores (node_modules, dist, etc.)
          FILES=$(git diff --diff-filter=d --name-only HEAD^1 HEAD | grep -E '\.(js|ts|jsx|tsx|json|jsonc)$' | grep -v -E '(node_modules|dist|build|\.next|\.cache|out|package-lock\.json|secrets)/' | grep -v 'package-lock\.json$' || true)
          echo "Changed files:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify SDK package lock
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- \
            packages/sdk/package.json packages/sdk/package-lock.json; then
            npm ci --ignore-scripts --prefix packages/sdk
          fi

      - name: Run Biome on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Running Biome on changed files:"
          echo "${{ steps.changed-files.outputs.files }}"
          echo "${{ steps.changed-files.outputs.files }}" | xargs npx biome check --write --no-errors-on-unmatched

      - name: Check for formatting changes
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Biome found formatting issues. Run 'npm run format' locally."
            git diff
            exit 1
          else
            echo "✅ All files are properly formatted"
          fi

      - name: Test SDK
        run: npm test --workspace @pollinations/sdk

      - name: Test UI
        run: npm test --workspace @pollinations/ui

      - name: Test maintenance scripts
        run: >-
          node --test
          .github/scripts/*.test.mjs
          enter.pollinations.ai/scripts/*.test.mjs
          enter.pollinations.ai/observability/scripts/*.test.mjs
          operations/app-management/*.test.js
          operations/app-management/ingestion/*.test.js
          operations/deployment/*.test.cjs
          operations/community-monitor/*.test.mjs
          operations/model-evals/*.test.js
          operations/model-monitor/src/*.test.js

      - name: Build UI for accounting and package export tests
        run: npm run build:js --workspace @pollinations/ui

      - name: Test model catalog and accounting compatibility
        run: npx vitest run --config apps/model-compatibility.vitest.config.ts

      - name: Get changed files that affect the enter frontend build
        id: enter-frontend
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(enter.pollinations.ai/|shared/|packages/(sdk|ui)/)'; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      # The enter test job stubs the assets directory, so this is the only
      # pull request check that the enter frontend still bundles.
      - name: Build enter frontend
        if: steps.enter-frontend.outputs.any_changed == 'true'
        working-directory: enter.pollinations.ai
        run: npm run build:frontend

      - name: Test UI package exports
        run: node --test packages/ui/scripts/package-exports.test.mjs

  enter:
    name: Test enter.pollinations.ai
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Get changed TypeScript files in enter.pollinations.ai
        id: enter-ts-files
        run: |
          FILES=$(git diff --diff-filter=d --name-only HEAD^1 HEAD | grep -E '^(enter.pollinations.ai/|shared/).*\.(ts|tsx)$' || true)
          echo "Changed TypeScript files:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check for API example validation changes
        id: enter-docs
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- enter.pollinations.ai shared gen.pollinations.ai/scripts/generate-apidocs.ts gen.pollinations.ai/scripts/validate-request-examples.ts gen.pollinations.ai/package.json package.json package-lock.json .github/workflows/ci-pull-request-checks.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.enter-ts-files.outputs.any_changed == 'true' || steps.enter-docs.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        if: steps.enter-ts-files.outputs.any_changed == 'true' || steps.enter-docs.outputs.changed == 'true'
        run: npm ci

      - name: Test enter.pollinations.ai
        if: steps.enter-ts-files.outputs.any_changed == 'true'
        working-directory: enter.pollinations.ai
        run: npm test

      - name: Validate Enter API request examples
        if: steps.enter-ts-files.outputs.any_changed != 'true' && steps.enter-docs.outputs.changed == 'true'
        working-directory: enter.pollinations.ai
        run: npm test -- test/docs-redirect.test.ts

      - name: Typecheck changed files only
        if: steps.enter-ts-files.outputs.any_changed == 'true'
        working-directory: enter.pollinations.ai
        run: |
          echo "Running typecheck and filtering for changed files..."

          # Run typecheck, capture output (don't fail yet)
          npx tsc --noEmit 2>&1 | tee /tmp/typecheck-output.txt || true

          # Check if any errors are in the changed files
          CHANGED_FILES="${{ steps.enter-ts-files.outputs.files }}"
          FOUND_ERROR=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            enter_file="${file#enter.pollinations.ai/}"
            # Look for this file in the typecheck output
            if grep -q "$enter_file\|$file" /tmp/typecheck-output.txt 2>/dev/null; then
              echo "❌ Type error in changed file: $file"
              grep -E "$enter_file|$file" /tmp/typecheck-output.txt || true
              FOUND_ERROR=true
            fi
          done <<< "$CHANGED_FILES"

          if [ "$FOUND_ERROR" = true ]; then
            echo ""
            echo "❌ Type errors found in changed files. Please fix them."
            exit 1
          else
            echo "✅ No type errors in changed files"
          fi

  gen:
    name: Test gen.pollinations.ai (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Every test file starts its own Workers runtime, so the files are split
    # across three runners. A fourth runner saved only ~20 s (#18135).
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Get changed files that affect gen.pollinations.ai
        id: gen-files
        run: |
          # Include imported docs and old paths of deleted or renamed inputs.
          FILES=$(git diff --no-renames --name-only HEAD^1 HEAD | grep -E '^(gen\.pollinations\.ai/|shared/|packages/ui/src/(styles/tokens\.css|brand/lockup-horizontal(-white)?\.svg)$|pollinations\.ai/public/legal/SUBPROCESSORS\.md$|packages/polli-cli/(README|SKILL|TASKS)\.md$|\.claude/skills/(bring-your-own-pollen|pollinations-api|pollinations-sdk|quest-contributor)/SKILL\.md$|(BRING_YOUR_OWN_MODEL|BRING_YOUR_OWN_POLLEN|BUILD_YOUR_OWN_AGENT|CODING_HARNESSES)\.md$|package(-lock)?\.json$|\.github/workflows/ci-pull-request-checks\.yml$)' || true)
          echo "Changed files that affect gen.pollinations.ai:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.gen-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        if: steps.gen-files.outputs.any_changed == 'true'
        run: npm ci

      - name: Test gen.pollinations.ai
        if: steps.gen-files.outputs.any_changed == 'true'
        run: npm test --workspace pollinations-gen -- --shard=${{ matrix.shard }}/3

      - name: Typecheck gen.pollinations.ai
        if: steps.gen-files.outputs.any_changed == 'true' && matrix.shard == 1
        run: npm run typecheck --workspace pollinations-gen

  media-docs:
    name: Validate media.pollinations.ai API examples
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Check for API example validation changes
        id: changes
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- media.pollinations.ai shared enter.pollinations.ai/drizzle gen.pollinations.ai/scripts/generate-apidocs.ts gen.pollinations.ai/scripts/validate-request-examples.ts gen.pollinations.ai/package.json package.json package-lock.json .github/workflows/ci-pull-request-checks.yml; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'

      - name: Install workspace dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Validate Media API request examples
        if: steps.changes.outputs.changed == 'true'
        working-directory: media.pollinations.ai
        run: npm test -- test/docs.test.ts

  website:
    name: Build pollinations.ai
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 2

      - name: Get changed files that affect the website
        id: website-files
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(pollinations.ai/|packages/(sdk|ui)/)'; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.website-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true
          cache: 'npm'

      - name: Install dependencies
        if: steps.website-files.outputs.any_changed == 'true'
        run: |
          npm ci
          npm ci --prefix pollinations.ai

      # Builds packages/sdk and packages/ui first, then typechecks and bundles.
      - name: Build pollinations.ai
        if: steps.website-files.outputs.any_changed == 'true'
        working-directory: pollinations.ai
        run: npm run build

      - name: Test pollinations.ai
        if: steps.website-files.outputs.any_changed == 'true'
        run: npm test --prefix pollinations.ai

  # Carries the status-check name required by the main branch ruleset so the
  # jobs above gate merges without a ruleset change.
  gate:
    name: Check formatting and linting
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, enter, gen, media-docs, website]
    if: always()

    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A job did not succeed: ${{ toJSON(needs) }}"
          exit 1
