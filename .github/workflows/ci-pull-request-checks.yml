name: CI / Pull request checks

"on":
  pull_request:
    branches: [main, master]

# HEAD is the pull request merge commit. With fetch-depth 2 its first parent
# (HEAD^1) is the base branch tip, so `git diff HEAD^1 HEAD` is the pull
# request diff without fetching the full repository history.

jobs:
  lint:
    name: Lint and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Validate app catalog
        run: node operations/app-management/app.js validate

      - name: Get changed files
        id: changed-files
        run: |
          # Get only added/modified files (exclude deleted files)
          # Also exclude paths that biome.jsonc ignores (node_modules, dist, etc.)
          FILES=$(git diff --diff-filter=d --name-only HEAD^1 HEAD | grep -E '\.(js|ts|jsx|tsx|json|jsonc)$' | grep -v -E '(node_modules|dist|build|\.next|\.cache|out|package-lock\.json|secrets)/' | grep -v 'package-lock\.json$' || true)
          echo "Changed files:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify SDK package lock
        run: |
          if ! git diff --quiet HEAD^1 HEAD -- \
            packages/sdk/package.json packages/sdk/package-lock.json; then
            npm ci --ignore-scripts --prefix packages/sdk
          fi

      - name: Run Biome on changed files
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          echo "Running Biome on changed files:"
          echo "${{ steps.changed-files.outputs.files }}"
          echo "${{ steps.changed-files.outputs.files }}" | xargs npx biome check --write

      - name: Check for formatting changes
        if: steps.changed-files.outputs.any_changed == 'true'
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "❌ Biome found formatting issues. Run 'npm run format' locally."
            git diff
            exit 1
          else
            echo "✅ All files are properly formatted"
          fi

      - name: Test maintenance scripts
        run: >-
          node --test
          enter.pollinations.ai/scripts/*.test.mjs
          operations/app-management/*.test.js
          operations/app-management/ingestion/*.test.js
          operations/deployment/*.test.cjs

      - name: Test model catalog and accounting compatibility
        run: npx vitest run --config apps/model-compatibility.vitest.config.ts

      - name: Get changed files that affect the enter frontend build
        id: enter-frontend
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(enter.pollinations.ai/|shared/|packages/(sdk|ui)/)'; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      # The enter test job stubs the assets directory, so this is the only
      # pull request check that the enter frontend still bundles.
      - name: Build enter frontend
        if: steps.enter-frontend.outputs.any_changed == 'true'
        working-directory: enter.pollinations.ai
        run: npm run build:frontend

  enter:
    name: Test enter.pollinations.ai
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed TypeScript files in enter.pollinations.ai
        id: enter-ts-files
        run: |
          FILES=$(git diff --diff-filter=d --name-only HEAD^1 HEAD | grep -E '^(enter.pollinations.ai/|shared/).*\.(ts|tsx)$' || true)
          echo "Changed TypeScript files:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.enter-ts-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.enter-ts-files.outputs.any_changed == 'true'
        run: npm ci

      - name: Test enter.pollinations.ai
        if: steps.enter-ts-files.outputs.any_changed == 'true'
        working-directory: enter.pollinations.ai
        run: npm test

      - name: Typecheck changed files only
        if: steps.enter-ts-files.outputs.any_changed == 'true'
        working-directory: enter.pollinations.ai
        run: |
          echo "Running typecheck and filtering for changed files..."

          # Run typecheck, capture output (don't fail yet)
          npx tsc --noEmit 2>&1 | tee /tmp/typecheck-output.txt || true

          # Check if any errors are in the changed files
          CHANGED_FILES="${{ steps.enter-ts-files.outputs.files }}"
          FOUND_ERROR=false

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            enter_file="${file#enter.pollinations.ai/}"
            # Look for this file in the typecheck output
            if grep -q "$enter_file\|$file" /tmp/typecheck-output.txt 2>/dev/null; then
              echo "❌ Type error in changed file: $file"
              grep -E "$enter_file|$file" /tmp/typecheck-output.txt || true
              FOUND_ERROR=true
            fi
          done <<< "$CHANGED_FILES"

          if [ "$FOUND_ERROR" = true ]; then
            echo ""
            echo "❌ Type errors found in changed files. Please fix them."
            exit 1
          else
            echo "✅ No type errors in changed files"
          fi

  gen:
    name: Test gen.pollinations.ai
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Get changed files that affect gen.pollinations.ai
        id: gen-files
        run: |
          FILES=$(git diff --diff-filter=d --name-only HEAD^1 HEAD | grep -E '^(gen.pollinations.ai/|shared/)' || true)
          echo "Changed files that affect gen.pollinations.ai:"
          echo "$FILES"
          echo "files<<EOF" >> $GITHUB_OUTPUT
          echo "$FILES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          if [ -n "$FILES" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Setup Node.js
        if: steps.gen-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.gen-files.outputs.any_changed == 'true'
        run: npm ci

      - name: Test gen.pollinations.ai
        if: steps.gen-files.outputs.any_changed == 'true'
        run: npm test --workspace pollinations-gen

      - name: Typecheck gen.pollinations.ai
        if: steps.gen-files.outputs.any_changed == 'true'
        run: npm run typecheck --workspace pollinations-gen

  connect:
    name: Build and test Connect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check Connect and product dependencies for changes
        id: connect-files
        run: |
          git diff --name-only HEAD^1 HEAD > "$RUNNER_TEMP/connect-changed-files"
          if grep -Eq '^(operations/connect/|enter\.pollinations\.ai/|gen\.pollinations\.ai/|packages/(auth|sdk|ui)/|shared/|package(-lock)?\.json$|\.github/workflows/ci-pull-request-checks\.yml$)' "$RUNNER_TEMP/connect-changed-files"; then
            echo "any_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "any_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node.js
        if: steps.connect-files.outputs.any_changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        if: steps.connect-files.outputs.any_changed == 'true'
        run: npm ci

      - name: Build and typecheck Connect
        if: steps.connect-files.outputs.any_changed == 'true'
        run: npm run build:connect

      # Credential-issuing integration tests require their own scoped run.
      # This job exercises local fixtures without production/provider secrets.
      - name: Test Connect
        if: steps.connect-files.outputs.any_changed == 'true'
        working-directory: operations/connect
        run: |
          npm test -- --exclude test/runtime.test.ts --exclude test/local-sign-in.test.ts
          npm test -- test/runtime.test.ts --testNamePattern='preserves real Enter error responses|opening review state preserves prepared data'

      - name: Install capture browser
        if: steps.connect-files.outputs.any_changed == 'true'
        working-directory: operations/connect
        run: npx playwright install --with-deps chromium

      - name: Verify real navigation and screen captures
        if: steps.connect-files.outputs.any_changed == 'true'
        working-directory: operations/connect
        run: |
          # Vite serves product source; the capture service owns disposable Workers.
          node ../../node_modules/vite/bin/vite.js --config vite.live.config.ts > "$RUNNER_TEMP/connect-source.log" 2>&1 &
          CONNECT_SOURCE_PID=$!
          trap 'kill "$CONNECT_SOURCE_PID" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if ! kill -0 "$CONNECT_SOURCE_PID" 2>/dev/null; then
              break
            fi
            if curl --fail --silent --output /dev/null http://localhost:4180/connect; then
              CONNECT_CAPTURE_TEST=1 npm test -- test/runtime.test.ts --testNamePattern='cancellation.*Map edges|Device lookup and approval recovery'
              CONNECT_CAPTURE_TEST=1 npm test -- test/captures.test.ts --testNamePattern='capture smoke covers every section|captures Device recovery without key creation'
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/connect-source.log"
          echo "Connect source server did not become ready."
          exit 1

  # Carries the status-check name required by the main branch ruleset so all
  # jobs above gate merges without a ruleset change.
  gate:
    name: Check formatting and linting
    runs-on: ubuntu-latest
    needs: [lint, enter, gen, connect]
    if: always()

    steps:
      - name: Require every job to succeed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "A job did not succeed: ${{ toJSON(needs) }}"
          exit 1
