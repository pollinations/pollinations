name: Data / Snapshot GitHub stars and app submissions

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kpi-github-stars
  cancel-in-progress: false

jobs:
  snapshot:
    if: github.repository == 'pollinations/pollinations'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          check-latest: true
      - run: node operations/kpi/scripts/snapshot-github.mjs
        env:
          GH_TOKEN: ${{ github.token }}
