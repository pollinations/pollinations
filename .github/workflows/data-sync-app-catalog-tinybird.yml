name: Data / Sync app catalog to Tinybird

on:
  push:
    branches: [main]
    paths: [operations/app-management/app.json]
  schedule:
    # Run at 05:00 UTC daily (after Apps / Update metrics at 04:00)
    - cron: '0 5 * * *'
  workflow_dispatch: # Manual trigger from GitHub UI

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Sync app.json to Tinybird
        env:
          TINYBIRD_SYNC_TOKEN: ${{ secrets.TINYBIRD_SYNC_TOKEN }}
        run: node operations/app-management/sync-to-tinybird.js
