name: Data / Sync GitHub traffic to Tinybird

on:
  schedule:
    # GitHub keeps traffic for 14 days only; a daily run keeps every day
    - cron: "30 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-traffic-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate Pollinations AI token
        id: pollinations-ai
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}
          owner: pollinations

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Sync traffic
        env:
          GITHUB_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
          TINYBIRD_SYNC_TOKEN: ${{ secrets.TINYBIRD_SYNC_TOKEN }}
        run: node operations/github/sync-traffic-to-tinybird.mjs
