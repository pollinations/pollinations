name: Data / Sync Search Console to Tinybird

on:
  schedule:
    # Search Console keeps 16 months; sync the latest final days daily
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: search-console-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v5

      # Keyless: GitHub's OIDC token is exchanged for a one-hour Google token of
      # a service account that is a restricted user of the Search Console property.
      - name: Authenticate to Google
        id: google
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GOOGLE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.SEARCH_CONSOLE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/webmasters.readonly

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Sync Search Console
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.google.outputs.access_token }}
          TINYBIRD_SYNC_TOKEN: ${{ secrets.TINYBIRD_SYNC_TOKEN }}
        run: node operations/search-console/sync-to-tinybird.mjs
