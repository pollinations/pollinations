name: Deploy / E2B templates

# Rebuilds the live sandbox templates from operations/infrastructure/e2b.
# Runs on production only: every new sandbox gets a template as soon as it's built.
on:
  push:
    branches: [production]
    paths:
      - "operations/infrastructure/e2b/**"
      - ".github/workflows/deploy-e2b-templates.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-e2b-templates
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/production'
    runs-on: ubuntu-latest
    environment: production
    env:
      E2B_API_KEY: ${{ secrets.E2B_API_KEY }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          check-latest: true

      # One after the other: the second build reuses the first one's cached steps.
      - name: Build pollinations
        run: npx -y @e2b/cli@2.21.2 template create pollinations --path operations/infrastructure/e2b --cpu-count 2 --memory-mb 2048

      # 50 GiB free disk is our team's cap; without the flag a rebuild drops to the default 21.
      - name: Build pollinations-large
        run: npx -y @e2b/cli@2.21.2 template create pollinations-large --path operations/infrastructure/e2b --cpu-count 4 --memory-mb 8192 --min-free-disk-mb 51200
