name: Deploy / Legacy Cloudflare caches

on:
  workflow_dispatch:

concurrency:
  group: pollinations-legacy-cache-deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_MYCELI }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MYCELI }}
    steps:
      - name: Checkout legacy master
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Show legacy revision
        run: git log -1 --format='%h %s'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install image cache dependencies
        working-directory: image.pollinations.ai/cloudflare-cache
        run: npm ci

      - name: Test image cache
        working-directory: image.pollinations.ai/cloudflare-cache
        run: npx vitest run test/attribution.test.ts

      - name: Install text cache dependencies
        working-directory: text.pollinations.ai/cloudflare-cache
        run: npm ci

      - name: Test text cache
        working-directory: text.pollinations.ai/cloudflare-cache
        run: npm test

      - name: Deploy image cache
        working-directory: image.pollinations.ai/cloudflare-cache
        run: npm run deploy

      - name: Deploy text cache
        working-directory: text.pollinations.ai/cloudflare-cache
        run: npm run deploy
