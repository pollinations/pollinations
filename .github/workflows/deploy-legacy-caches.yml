# Deploys master's legacy cache Workers (pollinations-text-cache and
# pollinations-image-cache) to the Myceli account. Manual runs only.
#
# Roll one Worker back to an earlier version (ids: `npx wrangler deployments
# list` in the Worker's folder):
#   gh workflow run deploy-legacy-caches.yml --ref main -f worker=text -f version=<id>
#
# Push the LEGACY_* GitHub secrets to a Worker, then deploy master. Production
# branch only, and only after the Secret Mutation Safety approval:
#   gh workflow run deploy-legacy-caches.yml --ref production -f worker=text -f sync_secrets=true
name: Deploy / Legacy Cloudflare caches

on:
  workflow_dispatch:
    inputs:
      worker:
        description: 'Which cache Worker'
        type: choice
        options:
          - both
          - text
          - image
        default: both
      version:
        description: 'Worker version id to roll back to instead of deploying master (text or image only)'
        type: string
        required: false
      sync_secrets:
        description: 'Push the LEGACY_* GitHub secrets to the Worker first (production branch only)'
        type: boolean
        default: false

concurrency:
  group: pollinations-legacy-cache-deploy
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch and inputs
        env:
          REF: ${{ github.ref }}
          WORKER: ${{ inputs.worker }}
          VERSION: ${{ inputs.version }}
          SYNC_SECRETS: ${{ inputs.sync_secrets }}
        run: |
          fail() { echo "::error::$1"; exit 1; }
          case "$REF" in
            refs/heads/main | refs/heads/production) ;;
            *) fail "Run this workflow from main or production, not $REF." ;;
          esac
          if [ "$SYNC_SECRETS" = true ] && [ "$REF" != refs/heads/production ]; then
            fail "sync_secrets runs only from production: production secrets are never synchronized from another branch."
          fi
          # Each secret approval covers one Worker.
          [ "$SYNC_SECRETS" != true ] || [ "$WORKER" != both ] || fail "Sync one Worker per run: choose worker=text or worker=image."
          if [ -n "$VERSION" ]; then
            [ "$WORKER" != both ] || fail "A version id belongs to one Worker: choose worker=text or worker=image."
            [[ "$VERSION" =~ ^[0-9a-f]{8}(-[0-9a-f]{4}){3}-[0-9a-f]{12}$ ]] || fail "version must be a Worker version id (a lowercase UUID)."
            # Cloudflare refuses (10220) to deploy a version created before a
            # later secret change, so never combine the two in one run.
            [ "$SYNC_SECRETS" != true ] || fail "Run sync_secrets and version separately."
          fi

  deploy:
    needs: check
    runs-on: ubuntu-latest
    strategy:
      # Each leg changes a different Worker; never cancel one mid-deploy.
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(inputs.worker == 'both' && '["text","image"]' || format('["{0}"]', inputs.worker)) }}
    defaults:
      run:
        # Explicit bash adds pipefail, so a failing wrangler in a pipe fails the step.
        shell: bash
        working-directory: ${{ matrix.worker }}.pollinations.ai/cloudflare-cache
    steps:
      - name: Checkout legacy master
        uses: actions/checkout@v5
        with:
          ref: master

      - name: Show legacy revision
        run: git log -1 --format='%h %s'

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          check-latest: true

      - name: Install dependencies
        run: npm ci

      - name: Test
        if: inputs.version == ''
        run: npm test

      # Runs before the deploy so code that requires these secrets finds them.
      # `secret bulk` edits the latest version and fails (Cloudflare 10214)
      # when that version is not the deployed one, e.g. right after a rollback:
      # deploy master without sync_secrets first, then sync.
      - name: Sync secrets
        if: inputs.sync_secrets && github.ref == 'refs/heads/production'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_MYCELI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MYCELI }}
          GEN_API_KEY: ${{ matrix.worker == 'text' && secrets.LEGACY_TEXT_GEN_API_KEY || matrix.worker == 'image' && secrets.LEGACY_IMAGE_GEN_API_KEY || '' }}
          WEFT_SELLER_API_KEY: ${{ secrets.LEGACY_WEFT_SELLER_API_KEY }}
        run: |
          for name in GEN_API_KEY WEFT_SELLER_API_KEY; do
            [ -n "${!name}" ] || { echo "::error::$name is empty: add its LEGACY_* GitHub secret first."; exit 1; }
          done
          jq -cn 'env | {GEN_API_KEY, WEFT_SELLER_API_KEY}' | npx wrangler secret bulk
          npx wrangler secret list --format json | jq -r '.[].name'

      - name: Deploy master
        if: inputs.version == ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_MYCELI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MYCELI }}
        run: npm run deploy

      - name: Roll back to version
        if: inputs.version != ''
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_MYCELI }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MYCELI }}
          VERSION: ${{ inputs.version }}
        run: npx wrangler versions deploy "$VERSION@100%" -y
