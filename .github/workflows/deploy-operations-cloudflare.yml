name: Deploy / Operations apps

on:
  push:
    branches:
      - production
    paths:
      - "operations/**"
      - "packages/ui/**"
      - "packages/sdk/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/deploy-operations-cloudflare.yml"
  workflow_dispatch:
    inputs:
      app:
        description: "Operation app to deploy"
        required: true
        type: choice
        default: all
        options:
          - all
          - kpi
          - quest-dashboard
          - economics
          - observability
          - model-monitor

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.detect.outputs.apps }}
      skip: ${{ steps.detect.outputs.skip }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Require production for manual deployment
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/production'
        run: |
          echo "Operations production deployments must run from the production branch"
          exit 1

      - name: Test operations deployment detection
        run: node --test operations/detect-deployments.test.cjs

      - name: Detect operation apps
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_APP: ${{ github.event.inputs.app || 'all' }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          SUPPORTED_APPS=$(node -e "console.log(Object.keys(require('./operations/deployments.json')).sort().join(' '))")

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "$SELECTED_APP" = "all" ]; then
              APPS="$SUPPORTED_APPS"
            else
              APPS="$SELECTED_APP"
            fi
          else
            if [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
              git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" > changed.txt
            else
              git diff --name-only HEAD~1 HEAD > changed.txt
            fi

            APPS=$(node operations/detect-deployments.cjs changed.txt)
          fi

          if [ -z "$APPS" ]; then
            echo "No operation Cloudflare app changes detected"
            echo "apps=[]" >> "$GITHUB_OUTPUT"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          APPS_JSON=$(APPS="$APPS" node -e 'console.log(JSON.stringify(process.env.APPS.trim().split(/\s+/)))')
          echo "Deploying operation apps: $APPS"
          echo "apps=$APPS_JSON" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

  deploy:
    needs: detect
    if: needs.detect.outputs.skip != 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.detect.outputs.apps) }}
    concurrency:
      group: operation-${{ matrix.app }}-production
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ matrix.app == 'observability' && secrets.CLOUDFLARE_API_TOKEN_OBSERVABILITY || secrets.CLOUDFLARE_API_TOKEN_MYCELI }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_MYCELI }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup SOPS
        if: matrix.app == 'kpi' || matrix.app == 'economics' || matrix.app == 'observability'
        uses: nhedger/setup-sops@v2

      - name: Verify Docker
        if: matrix.app == 'observability'
        run: docker info

      - name: Install operation app dependencies
        if: matrix.app != 'economics' && matrix.app != 'model-monitor'
        run: npm ci
        working-directory: ./operations/${{ matrix.app }}

      - name: Install Economics dependencies
        if: matrix.app == 'economics'
        run: npm ci

      - name: Install Model Monitor dependencies
        if: matrix.app == 'model-monitor'
        run: |
          npm ci
          npm ci --prefix operations/model-monitor

      - name: Build Model Monitor
        if: matrix.app == 'model-monitor'
        run: npm run build
        working-directory: ./operations/model-monitor

      - name: Deploy Model Monitor Pages project
        if: matrix.app == 'model-monitor'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MYCELI_APPS }}
        run: |
          PROJECT=$(node -p "require('./operations/deployments.json')['model-monitor'].cloudflareProject")
          npx wrangler pages deploy operations/model-monitor/dist \
            --project-name="$PROJECT" \
            --branch=production \
            --commit-dirty=true

      - name: Verify Model Monitor domains
        if: matrix.app == 'model-monitor'
        run: |
          ORIGIN=$(node -p "require('./operations/deployments.json')['model-monitor'].originUrl")
          PUBLIC=$(node -p "require('./operations/deployments.json')['model-monitor'].publicUrl")
          curl --fail --silent --show-error --output /dev/null \
            --retry 12 --retry-delay 10 --retry-all-errors "$ORIGIN"
          curl --fail --silent --show-error --output /dev/null \
            --retry 12 --retry-delay 10 --retry-all-errors "$PUBLIC"

      - name: Deploy KPI Worker
        if: matrix.app == 'kpi'
        run: npm run deploy
        working-directory: ./operations/kpi

      - name: Push KPI secrets
        if: matrix.app == 'kpi'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: sops exec-file --no-fifo secrets/env.json 'npx wrangler secret bulk {}'
        working-directory: ./operations/kpi

      - name: Build Economics Worker
        if: matrix.app == 'economics'
        run: npm run build
        working-directory: ./operations/economics/web

      - name: Deploy Economics Worker
        if: matrix.app == 'economics'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY_ECONOMICS }}
        run: sops exec-file --no-fifo ../secrets/web.json 'npx wrangler deploy --secrets-file {}'
        working-directory: ./operations/economics/web

      - name: Verify Economics Myceli origin
        if: matrix.app == 'economics'
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            https://economics.myceli.ai/api/auth/session

      - name: Verify Economics Pollinations public URL
        if: matrix.app == 'economics'
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            https://economics.pollinations.ai/api/auth/session

      - name: Deploy Quest Dashboard Worker
        if: matrix.app == 'quest-dashboard'
        run: npm run deploy
        working-directory: ./operations/quest-dashboard

      - name: Validate Observability Worker configuration
        if: matrix.app == 'observability'
        run: npm run check
        working-directory: ./operations/observability

      - name: Deploy Observability Grafana container Worker
        if: matrix.app == 'observability'
        run: npm run deploy
        working-directory: ./operations/observability

      - name: Push Observability Grafana secrets
        if: matrix.app == 'observability'
        env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        run: npm run push-secrets
        working-directory: ./operations/observability

      - name: Verify Observability Myceli origin health
        if: matrix.app == 'observability'
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            https://observability.myceli.ai/api/health

      - name: Verify Observability Pollinations public URL
        if: matrix.app == 'observability'
        run: |
          curl --fail --retry 12 --retry-delay 10 --retry-all-errors \
            https://observability.pollinations.ai/api/health
