name: Deploy / pollinations.ai

on:
  push:
    branches:
      - production
    paths:
      - 'pollinations.ai/**'
      - 'shared/**'
      - 'packages/sdk/**'
      - 'packages/ui/**'
      - '.github/workflows/deploy-website-cloudflare.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The site links packages/sdk and packages/ui from source, so their
      # dist must exist before the site bundles.
      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix pollinations.ai

      - name: Build shared packages
        run: npm run build:ui
        working-directory: ./pollinations.ai

      - name: Build and deploy to Cloudflare
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_MYCELI }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_MYCELI }}
        run: npm run deploy:production
        working-directory: ./pollinations.ai
