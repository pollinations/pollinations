name: Evals / Weekly model evals

# Runs the AIW model eval (operations/model-evals) against every text model
# on gen.pollinations.ai — community models included — and commits the
# results into the model-monitor's public/evals/ directory on an
# auto-merging branch. Requires the PLN_GITHUB_EVALS_KEY secret (a
# Pollinations API key); until it is set, the run fails fast with a clear
# message instead of half-running.

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays at 05:00 UTC
  workflow_dispatch:
    inputs:
      models:
        description: "Comma-separated model names/aliases to score (empty = all)"
        required: false
        type: string
      only:
        description: "Scope: empty (all), community, or official"
        required: false
        type: string
      questions:
        description: "Questions per family"
        required: false
        type: number
        default: 3

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: model-evals
  cancel-in-progress: false

jobs:
  run-evals:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Generate Pollinations AI Token
        id: pollinations-ai
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          token: ${{ steps.pollinations-ai.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Configure git
        run: |
          git config user.name "pollinations-ai[bot]"
          git config user.email "pollinations-ai[bot]@users.noreply.github.com"

      - name: Check for the Pollinations API key
        env:
          POLLINATIONS_API_KEY: ${{ secrets.PLN_GITHUB_EVALS_KEY }}
        run: |
          if [ -z "$POLLINATIONS_API_KEY" ]; then
            echo "PLN_GITHUB_EVALS_KEY is not set. Ask a maintainer to add a Pollinations API key (https://enter.pollinations.ai/keys) as the PLN_GITHUB_EVALS_KEY secret."
            exit 1
          fi

      - name: Run the model eval
        id: eval
        env:
          POLLINATIONS_API_KEY: ${{ secrets.PLN_GITHUB_EVALS_KEY }}
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.models }}" ]; then
            ARGS="$ARGS --models '${{ github.event.inputs.models }}'"
          fi
          if [ -n "${{ github.event.inputs.only }}" ]; then
            ARGS="$ARGS --only ${{ github.event.inputs.only }}"
          fi
          if [ -n "${{ github.event.inputs.questions }}" ]; then
            ARGS="$ARGS --questions ${{ github.event.inputs.questions }}"
          fi

          # Exit code 1 means the Pollen cost cap was reached: results are
          # still written for the models that scored, so keep going and
          # flag it in the summary.
          set +e
          node operations/model-evals/cli.mjs \
            --out operations/model-monitor/public/evals/latest.json \
            --history operations/model-monitor/public/evals/history.json \
            $ARGS
          EXIT_CODE=$?
          set -e
          if [ "$EXIT_CODE" -ne 0 ] && [ "$EXIT_CODE" -ne 1 ]; then
            exit "$EXIT_CODE"
          fi
          if [ "$EXIT_CODE" -eq 1 ]; then
            echo "::warning::Pollen cost cap reached; some models were not scored"
          fi

      - name: Check for changes
        id: changes
        run: |
          if [ ! -f operations/model-monitor/public/evals/latest.json ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          elif git diff --quiet -- operations/model-monitor/public/evals/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          BRANCH="auto/model-evals-$(date -u +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add operations/model-monitor/public/evals/
          git commit -m "chore: weekly model eval results $(date -u +%Y-%m-%d)"
          git push -f origin "$BRANCH"

      - name: Create or update PR
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
        run: |
          BRANCH="auto/model-evals-$(date -u +%Y-%m-%d)"
          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url' || true)

          if [ -n "$EXISTING_PR" ]; then
            echo "PR already exists: $EXISTING_PR"
            PR_URL="$EXISTING_PR"
          else
            PR_URL=$(gh pr create \
              --title "chore: weekly model eval results $(date -u +%Y-%m-%d)" \
              --body "Automated update of the AIW model eval leaderboard and run history. See operations/model-evals/README.md for details.")
            echo "Created PR: $PR_URL"
          fi

          gh pr merge "$PR_URL" --auto --squash --delete-branch

      - name: Open an issue if the run failed
        if: failure()
        env:
          GH_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
        run: |
          gh issue create \
            --title "Weekly model eval failed ($(date -u +%Y-%m-%d))" \
            --body "The scheduled model eval workflow failed. Check the run logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --label "evals"
