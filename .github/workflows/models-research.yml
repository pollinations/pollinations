name: Models / Research

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Official canonical IDs or aliases, comma separated. Empty = full backfill.'
        type: string
        default: ''
      max_pollen:
        description: 'Pollen admission cap for usage accounting and uncertain reservations (0 < budget <= 10).'
        type: string
        default: '10'
      publish_issue:
        description: 'Create the parent research issue. Disable for a smoke test.'
        type: boolean
        default: true
      use_perplexity:
        description: 'Use Perplexity only if its current pricing has no unbounded adjustments.'
        type: boolean
        default: false

permissions:
  actions: read
  contents: read

concurrency:
  group: model-research
  cancel-in-progress: false

jobs:
  researcher:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Scrapling fetcher
        run: python -m pip install 'scrapling[fetchers]==0.4.15'
      - name: Validate researcher
        env:
          RUN_LIVE_FETCH: '1'
        run: node --test operations/model-management/*.test.mjs
      - name: Find previous completed main research evidence
        id: previous
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/models-research.yml/runs?branch=main&status=completed&per_page=20" \
            --jq ".workflow_runs | map(select(.head_branch == \"main\" and .status == \"completed\" and .id != $GITHUB_RUN_ID)) | sort_by(.created_at) | reverse | .[0].id // empty")
          if [ -z "$run_id" ]; then
            echo "No prior completed main run; performing first backfill."
            exit 0
          fi
          artifact_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" \
            --jq ".artifacts | map(select(.expired == false and (.name | startswith(\"model-research-$run_id-\")))) | sort_by(.created_at) | reverse | .[0].id // empty")
          if [ -n "$artifact_id" ]; then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
            echo "artifact_id=$artifact_id" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Previous research artifact unavailable; researching current inventory."
          fi
      - name: Restore previous evidence for free source refresh
        id: restore
        if: steps.previous.outputs.artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.previous.outputs.artifact_id }}
          run-id: ${{ steps.previous.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/model-research-previous
          merge-multiple: true
      - name: Research official catalog and market (GPT-6.1 Sol, medium effort)
        env:
          POLLINATIONS_API_KEY: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
          MODELS: ${{ inputs.models }}
          MAX_POLLEN: ${{ inputs.max_pollen }}
          USE_PERPLEXITY: ${{ inputs.use_perplexity }}
          CHECK_BILLING: 'true'
          RESEARCH_OUT: ${{ runner.temp }}/model-research
          PREVIOUS_RESEARCH: ${{ runner.temp }}/model-research-previous/research.json
        run: node operations/model-management/researcher.mjs
      - name: Save findings and partial evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-research-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-research/
          if-no-files-found: error
          retention-days: 14
      - name: Publish parent issue for manual verification handoff
        if: always() && !cancelled() && inputs.publish_issue && steps.evidence.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          RESEARCH_OUT: ${{ runner.temp }}/model-research
          RESEARCH_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node operations/model-management/researcher.mjs publish
      - name: Save parent publication receipt and uncertain writes
        if: always() && inputs.publish_issue && steps.evidence.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: model-research-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/model-research/parent-*.json
          if-no-files-found: ignore
          retention-days: 14
