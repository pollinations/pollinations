name: Models / Research

on:
  workflow_dispatch:
    inputs:
      models:
        description: 'Official canonical IDs or aliases, comma separated. Empty = full backfill.'
        type: string
        default: ''
      max_pollen:
        description: 'Maximum reserved Pollen for inference and search (0 < budget <= 50).'
        type: string
        default: '15'
      publish_issue:
        description: 'Create the parent research issue. Disable for a smoke test.'
        type: boolean
        default: true
      use_perplexity:
        description: 'Opt in to paid Perplexity search as a second opinion; Exa remains the default.'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: model-research
  cancel-in-progress: false

jobs:
  researcher:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install local Scrapling fetcher
        run: python -m pip install 'scrapling[fetchers]==0.4.15'
      - name: Validate researcher
        env:
          RUN_LIVE_FETCH: '1'
        run: node --test operations/model-management/*.test.mjs
      - name: Research official catalog and market
        env:
          POLLINATIONS_API_KEY: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
          MODELS: ${{ inputs.models }}
          MAX_POLLEN: ${{ inputs.max_pollen }}
          USE_PERPLEXITY: ${{ inputs.use_perplexity }}
          RESEARCH_OUT: ${{ runner.temp }}/model-research
        run: node operations/model-management/researcher.mjs
      - name: Save findings and partial evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: model-research-${{ github.run_id }}
          path: ${{ runner.temp }}/model-research/
          if-no-files-found: error
          retention-days: 14
      - name: Publish parent issue for manual verification handoff
        if: always() && inputs.publish_issue && steps.evidence.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          RESEARCH_OUT: ${{ runner.temp }}/model-research
          RESEARCH_ARTIFACT_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: node operations/model-management/researcher.mjs publish
