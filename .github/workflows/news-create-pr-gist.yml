name: News / Create PR gist

on:
  pull_request_target:
    types: [closed]
    branches:
      - main
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to regenerate; reruns images and rewrites the saved Discord post (an already-sent post is never resent)'
        required: true
        type: number

jobs:
  generate-gist:
    # Only run if PR was merged (skip closed-without-merge)
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      issues: write

    steps:
      - name: Generate Pollinations AI Token
        id: pollinations-ai
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}
          owner: pollinations

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests PyYAML Jinja2

      - name: Set up Node
        uses: actions/setup-node@v5
        continue-on-error: true
        with:
          node-version: '24'
          cache: npm

      - name: Generate PR gist
        env:
          GITHUB_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_NEWS_KEY }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: python operations/social/scripts/gist.py

      - name: Save the Discord post
        # The post is sent by News / Deploy posts once the production deploy
        # that carries this PR has passed (#17406).
        env:
          GITHUB_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_NEWS_KEY }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.pull_request.number }}
          REPO_FULL_NAME: ${{ github.repository }}
        run: python operations/social/scripts/pr_post.py write

      - name: Report failure as an issue
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          token: ${{ github.token }}
