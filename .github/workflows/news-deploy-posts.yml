name: News / Deploy posts

# After each successful production deploy, posts every PR it shipped to Discord,
# one message with a picture per PR. A rerun skips the PRs already posted.
on:
  workflow_run:
    workflows: ['Deploy / Cloudflare production']
    types: [completed]
    branches: [production]
  workflow_dispatch:
    inputs:
      sha:
        description: 'The production commit of a successful deploy'
        required: true
        type: string

permissions: {}

# One run at a time, so the posts go out in deploy order; none is cancelled.
concurrency:
  group: news-deploy-posts
  queue: max
  cancel-in-progress: false

jobs:
  posts:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write  # the delivery record on the news branch
      actions: read
      pull-requests: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Post the shipped PRs
        env:
          SHA: ${{ inputs.sha || github.event.workflow_run.head_sha }}
          GITHUB_TOKEN: ${{ github.token }}
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_NEWS_KEY }}
          DISCORD_REALTIME_WEBHOOK_URL: ${{ secrets.DISCORD_REALTIME_WEBHOOK_URL }}
        run: python operations/social/scripts/deploy_posts.py "$SHA"

      - name: Report failure as an issue
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          token: ${{ github.token }}
