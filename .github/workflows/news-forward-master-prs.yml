name: News / Forward master PRs

# PRs into master (the legacy text and image APIs) use main's news pipeline:
# this hands the merged PR number to "News / Create PR gist" on main, which
# writes the gist and posts it to Discord like any PR merged into main.
on:
  pull_request_target:
    types: [closed]
    branches:
      - master

permissions:
  actions: write

jobs:
  forward:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Start the news pipeline on main
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: gh workflow run news-create-pr-gist.yml --repo "$GITHUB_REPOSITORY" --ref main -f pr_number="$PR_NUMBER"
