name: News / Posts

# Writes, saves and delivers the news posts at today's times. 06:00 records /models
# when it changed, writes yesterday's daily (on Sunday also the week, on the 1st also
# last month) and schedules their Buffer posts; Sunday 18:00 sends the week's Discord
# post. Wednesday 14:00 writes the model post and the community post, each from the
# recorded catalog against a week earlier; each is sent to Discord and only then
# saved. A run started by hand practises by default: it shows what it would save, and
# saves and delivers nothing.
on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 18 * * 0'
    - cron: '0 14 * * 3'
  workflow_dispatch:
    inputs:
      job:
        description: 'morning = what the 06:00 run does on that day; afternoon = the Sunday 18:00 run (the week''s Discord post); wednesday = the 14:00 model and community posts'
        required: true
        type: choice
        options:
          - morning
          - afternoon
          - wednesday
          - daily
          - weekly
          - monthly
          - models
          - community
          - catalog
      date:
        description: 'The day (morning, afternoon, daily, catalog), the Sunday (weekly), the month, YYYY-MM (monthly) or the Wednesday (wednesday, models, community)'
        required: true
        type: string
      run:
        description: 'preview saves and delivers nothing; write + save never delivers'
        required: true
        type: choice
        options:
          - preview
          - all
          - write + save
          - deliver
      overwrite:
        description: 'Write and save a date that is already saved again (its delivery record is kept)'
        type: boolean
        default: false

permissions: {}

# One run at a time; none is cancelled.
concurrency:
  group: news-posts
  queue: max
  cancel-in-progress: false

env:
  JOB: ${{ inputs.job || (github.event.schedule == '0 6 * * *' && 'morning' || github.event.schedule == '0 14 * * 3' && 'wednesday' || 'afternoon') }}
  RUN: ${{ inputs.run || 'all' }}

jobs:
  posts:
    if: ${{ (inputs.job || (github.event.schedule == '0 6 * * *' && 'morning' || github.event.schedule == '0 14 * * 3' && 'wednesday' || 'afternoon')) != 'afternoon' && (inputs.run || 'all') != 'deliver' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Choose the posts
        id: posts
        env:
          DATE: ${{ inputs.date }}
          GH_TOKEN: ${{ github.token }}
        # A scheduled run is for the day it was created, so a rerun keeps it.
        # The 06:00 run on day T records the catalog, then writes T−1's daily, on
        # Sunday also the week ending T, and on the 1st also last month, in that order.
        run: |
          DATE=${DATE:-$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at[:10]')}
          python - "$JOB" "$DATE" >> "$GITHUB_OUTPUT" <<'EOF'
          import sys
          from datetime import UTC, date, datetime, timedelta
          sys.path.insert(0, "operations/social/scripts")
          from posts import check_date
          job, day = sys.argv[1:]
          posts = [(job, day)]
          if job == "wednesday":
              posts = [("models", day), ("community", day)]
          if job == "morning":
              check_date("daily", day)
              today = date.fromisoformat(day)
              yesterday = today - timedelta(days=1)
              posts = [("daily", yesterday.isoformat())]
              # /models is only recorded as it is now: a rerun on a later day skips it.
              if day == datetime.now(UTC).strftime("%Y-%m-%d"):
                  posts.insert(0, ("catalog", day))
              if today.isoweekday() == 7:
                  posts.append(("weekly", today.isoformat()))
              if today.day == 1:
                  posts.append(("monthly", yesterday.strftime("%Y-%m")))
          for job, day in posts:
              check_date(job, day)
          print("posts=" + " ".join(f"{job} {day}" for job, day in posts))
          EOF

      - name: Checkout news
        uses: actions/checkout@v5
        with:
          ref: news
          path: news
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /operations/social/news/data/
            /operations/social/news/posts/

      - name: Pollinations bot token
        # Reads each PR's Area, Work type and Source from the Dev project.
        id: bot
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}
          owner: pollinations

      - name: Write and save
        env:
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_NEWS_KEY }}
          GITHUB_TOKEN: ${{ steps.bot.outputs.token }}  # the day's PRs and the month's merged PRs
          POSTS: ${{ steps.posts.outputs.posts }}
          OVERWRITE: ${{ inputs.overwrite || env.RUN == 'preview' }}
        # Each post is saved and pushed before the next is written. A preview
        # saves without committing, for the next step to show. The model and
        # community posts are only written here: the deliver job saves each once
        # Discord has it.
        run: |
          git -C news config user.name "github-actions[bot]"
          git -C news config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          flag=
          [ "$OVERWRITE" = true ] && flag=--overwrite
          set -- $POSTS
          while [ $# -gt 0 ]; do
            saved="news/operations/social/news/data/summaries/$1/$2.json"
            commands="write save"
            [ "$1" = catalog ] && saved="news/operations/social/news/data/models/$2.json"
            if [ "$1" = models ] || [ "$1" = community ]; then
              saved="news/operations/social/news/posts/discord/$1/$2.json"
              [ "$RUN" != preview ] && commands=write
            fi
            if [ -z "$flag" ] && [ -e "$saved" ]; then
              echo "$1 $2 is already saved"
            else
              for command in $commands; do
                python operations/social/scripts/posts.py "$command" "$1" "$2" --news news --work "work/$1" $flag
              done
              git -C news add --all
              if [ "$RUN" != preview ] && ! git -C news diff --cached --quiet; then
                git -C news commit -qm "news: add $1 $2"
                for try in 1 2 3; do
                  git -C news push -q origin HEAD:news && break
                  [ "$try" = 3 ] && exit 1
                  git -C news pull -q --rebase origin news
                done
              fi
            fi
            shift 2
          done

      - name: Show what would be saved
        # Also after a failed post, to show the ones saved before it.
        if: ${{ !cancelled() && env.RUN == 'preview' }}
        run: |
          git -C news add --all
          git -C news diff --cached --stat
          git -C news diff --cached -- '*.json'

      - name: Keep what would be saved
        # The texts and pictures, to compare with what is on news.
        if: ${{ !cancelled() && env.RUN == 'preview' }}
        uses: actions/upload-artifact@v7
        with:
          name: preview
          path: work/
          if-no-files-found: ignore

      - name: Keep the model and community posts for the deliver job
        if: ${{ contains(fromJSON('["models", "community", "wednesday"]'), env.JOB) && env.RUN != 'preview' }}
        uses: actions/upload-artifact@v7
        with:
          name: posts
          path: work/

      - name: Report failure as an issue
        if: ${{ failure() && env.RUN != 'preview' }}
        uses: ./.github/actions/failure-issue
        with:
          token: ${{ github.token }}
          title: News / Posts — writing

  deliver:
    needs: posts
    # After the posts, even when one failed, so a failed month never stops the day's
    # posts; the model and community posts only after they were written.
    if: ${{ !cancelled() && (inputs.run || 'all') != 'preview' && (inputs.run || 'all') != 'write + save' && (needs.posts.result == 'success' || !contains(fromJSON('["models", "community", "wednesday"]'), inputs.job || (github.event.schedule == '0 14 * * 3' && 'wednesday' || ''))) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
      issues: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch the model and community posts
        if: ${{ contains(fromJSON('["models", "community", "wednesday"]'), env.JOB) }}
        uses: actions/download-artifact@v8
        with:
          name: posts
          path: work

      - name: Deliver
        env:
          DATE: ${{ inputs.date }}
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          DISCORD_WEEKLY_WEBHOOK_URL: ${{ secrets.DISCORD_WEEKLY_WEBHOOK_URL }}
          DISCORD_MODELS_WEBHOOK_URL: ${{ secrets.DISCORD_MODELS_WEBHOOK_URL }}
          DISCORD_MODELS_ROLE_ID: ${{ secrets.DISCORD_MODELS_ROLE_ID }}
        # The morning schedules the Buffer posts of what it wrote; the Sunday
        # afternoon sends the week's Discord post. Every delivery is tried, then
        # the run fails if one did.
        run: |
          DATE=${DATE:-$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at[:10]')}
          commands=()
          case "$JOB" in
            morning|afternoon)
              yesterday=$(date -ud "$DATE -1 day" +%F)
              weekday=$(date -ud "$DATE" +%u) ;;
          esac
          case "$JOB" in
            morning)
              commands=("schedule daily $yesterday")
              [ "$weekday" = 7 ] && commands+=("schedule weekly $DATE") ;;
            afternoon)
              [ "$weekday" = 7 ] && commands=("send weekly $DATE") ;;
            daily|weekly)
              commands=("schedule $JOB $DATE") ;;
            models|community)
              commands=("send $JOB $DATE --work work/$JOB") ;;
            wednesday)
              commands=("send models $DATE --work work/models" "send community $DATE --work work/community") ;;
          esac
          failed=0
          for command in "${commands[@]}"; do
            python operations/social/scripts/deliver.py $command || failed=1
          done
          exit $failed

      - name: Checkout news for the model and community posts
        if: ${{ contains(fromJSON('["models", "community", "wednesday"]'), env.JOB) }}
        uses: actions/checkout@v5
        with:
          ref: news
          path: news
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /operations/social/news/data/
            /operations/social/news/posts/discord/

      - name: Save the model and community posts
        if: ${{ contains(fromJSON('["models", "community", "wednesday"]'), env.JOB) }}
        env:
          DATE: ${{ inputs.date }}
          GH_TOKEN: ${{ github.token }}
          DISCORD_MODELS_ROLE_ID: ${{ secrets.DISCORD_MODELS_ROLE_ID }}
        # Only after Discord has it: the saved post is what went out. A week without
        # changes saves nothing, and a rerun after a save finds it saved.
        run: |
          DATE=${DATE:-$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --jq '.created_at[:10]')}
          jobs=$JOB
          [ "$JOB" = wednesday ] && jobs="models community"
          for job in $jobs; do
            if [ -e "news/operations/social/news/posts/discord/$job/$DATE.json" ]; then
              echo "$job $DATE is already saved"
            else
              python operations/social/scripts/posts.py save "$job" "$DATE" --news news --work "work/$job"
            fi
          done
          git -C news config user.name "github-actions[bot]"
          git -C news config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C news add --all
          git -C news diff --cached --quiet && exit 0
          git -C news commit -qm "news: add $jobs $DATE"
          for try in 1 2 3; do
            git -C news push -q origin HEAD:news && break
            [ "$try" = 3 ] && exit 1
            git -C news pull -q --rebase origin news
          done

      - name: Report failure as an issue
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          token: ${{ github.token }}
          title: News / Posts — delivery
