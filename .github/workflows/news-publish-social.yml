name: News / Publish social posts

on:
  schedule:
    - cron: '0 18 * * 0'    # Sunday 18:00 UTC — weekly Discord
  workflow_dispatch:
    inputs:
      target_date:
        description: 'Sunday publish date (YYYY-MM-DD) for a manual publish.'
        required: false
        type: string

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Generate Pollinations AI Token
        id: pollinations-ai
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}

      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests PyYAML Jinja2

      - name: Overlay news branch data
        run: git fetch origin news && git checkout origin/news -- operations/social/news/ || echo "No news branch data yet"

      - name: Publish weekly Discord
        env:
          GITHUB_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PUBLISH_MODE: direct
          WEEKLY_DATE: ${{ github.event.inputs.target_date || '' }}
          DISCORD_WEEKLY_WEBHOOK_URL: ${{ secrets.DISCORD_WEEKLY_WEBHOOK_URL }}
        run: python operations/social/scripts/publish_weekly.py

      - name: Report failure as an issue
        if: failure()
        uses: ./.github/actions/failure-issue
        with:
          token: ${{ github.token }}
