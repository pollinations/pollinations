name: Repo / Close discarded issues

on:
  schedule:
    - cron: '0 * * * *'  # Run every hour
  workflow_dispatch:

jobs:
  close-discarded:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Pollinations AI Token
        id: pollinations-ai
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}
          owner: pollinations

      - name: Close issues in "Discarded" column
        uses: actions/github-script@v8
        with:
          github-token: ${{ steps.pollinations-ai.outputs.token }}
          script: |
            const PROJECT_NUMBER = 20;

            // Only open issues can be closed, so search those (any org repo) instead of
            // paging through every item in the project.
            const query = `
              query($cursor: String) {
                search(query: "org:pollinations is:issue is:open project:pollinations/${PROJECT_NUMBER}", type: ISSUE, first: 100, after: $cursor) {
                  pageInfo { hasNextPage endCursor }
                  nodes {
                    ... on Issue {
                      number
                      title
                      repository { name owner { login } }
                      projectItems(first: 10) {
                        nodes {
                          project { number }
                          status: fieldValueByName(name: "Status") {
                            ... on ProjectV2ItemFieldSingleSelectValue { name }
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            let cursor = null;
            let checked = 0;
            do {
              const { search } = await github.graphql(query, { cursor });
              for (const issue of search.nodes) {
                checked++;
                const discarded = issue.projectItems.nodes.some(
                  (item) => item.project.number === PROJECT_NUMBER && item.status?.name === 'Discarded'
                );
                if (!discarded) continue;

                console.log(`Closing ${issue.repository.name}#${issue.number} "${issue.title}" (Status: Discarded)`);
                await github.rest.issues.update({
                  owner: issue.repository.owner.login,
                  repo: issue.repository.name,
                  issue_number: issue.number,
                  state: 'closed',
                  state_reason: 'not_planned'
                });
              }
              cursor = search.pageInfo.hasNextPage ? search.pageInfo.endCursor : null;
            } while (cursor);

            console.log(`Checked ${checked} open issues in project #${PROJECT_NUMBER}`);
