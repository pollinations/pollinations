name: Repo / Organize issues and PRs

on:
  issues:
    types: [opened, labeled]
  pull_request_target:
    types: [opened]
  # Reclassify Area, Source and type. Fill empty Priority and Model work fields. Defaults to every open PR.
  workflow_dispatch:
    inputs:
      check_weaver_owner:
        description: "Check the existing Pollinations caller identity without organizing items"
        type: boolean
        default: false
      probe_model_digest:
        description: "Owner check only. Optional SHA-256 of a verified tool-free private model ID for the paired transport probe"
        required: false
      pr_numbers:
        description: "Space-separated PR numbers (empty with no issue numbers = all open PRs)"
        required: false
      issue_numbers:
        description: "Space-separated issue numbers"
        required: false
      dry_run:
        description: "Log the changes without applying them"
        type: boolean
        default: true

concurrency:
  group: project-manager-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  check-weaver-owner:
    if: github.event_name == 'workflow_dispatch' && inputs.check_weaver_owner
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check the Pollinations caller identity
        env:
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --max-time 30 \
            -H "Authorization: Bearer $POLLINATIONS_TOKEN" \
            https://gen.pollinations.ai/account/profile |
            jq -er '
              if (has("githubUsername") | not) then error("Unexpected profile response") else
                (if .email == null then "Account email unavailable to this key"
                 elif .email == "polli@pollinations.ai" then "Account email matches polli@pollinations.ai"
                 elif .email == "polly@pollinations.ai" then "Account email matches polly@pollinations.ai"
                 else "Account email differs from both proposed owners" end),
                (if .githubUsername == null then "No GitHub account linked"
                 elif (.githubUsername | ascii_downcase) == "pollinations-ai" then "Linked GitHub user matches pollinations-ai"
                 else "Linked GitHub user differs from pollinations-ai" end)
              end' | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/checkout@v5
        if: inputs.probe_model_digest != ''
        with:
          persist-credentials: false
      - name: Probe private-agent Chat Completions
        if: inputs.probe_model_digest != ''
        env:
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
          PROBE_MODEL_DIGEST: ${{ inputs.probe_model_digest }}
        run: python operations/infrastructure/project-manager/probe_agent.py

  organize:
    # Reclassify after a workflow label changes the source.
    if: >-
      !(github.event_name == 'workflow_dispatch' && inputs.check_weaver_owner) &&
      (github.event.action != 'labeled' || github.event.label.name == 'APP-SUBMISSION' || github.event.label.name == 'QUEST')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      repository-projects: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate Pollinations AI Token
        id: pollinations-ai
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}
          owner: pollinations

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Project Manager
        env:
          GITHUB_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: bash operations/infrastructure/project-manager/run.sh
