name: Repo / Organize issues and PRs

on:
  issues:
    types: [opened, labeled]
  pull_request_target:
    types: [opened]
  # Reclassify Area, Source and type. Fill empty Priority fields. Defaults to every open PR.
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: "Space-separated PR numbers (empty with no issue numbers = all open PRs)"
        required: false
      issue_numbers:
        description: "Space-separated issue numbers"
        required: false
      dry_run:
        description: "Log the changes without applying them"
        type: boolean
        default: true

concurrency:
  group: project-manager-${{ github.event.issue.number || github.event.pull_request.number || 'manual' }}
  cancel-in-progress: false

jobs:
  organize:
    # Reclassify after a workflow label changes the source.
    if: github.event.action != 'labeled' || github.event.label.name == 'APP-SUBMISSION' || github.event.label.name == 'QUEST'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
      repository-projects: write
    steps:
      - uses: actions/checkout@v5

      - name: Generate Pollinations AI Token
        id: pollinations-ai
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.POLLY_BOT_APP_ID }}
          private-key: ${{ secrets.POLLY_BOT_PRIVATE_KEY }}
          owner: pollinations

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Run Project Manager
        env:
          GITHUB_TOKEN: ${{ steps.pollinations-ai.outputs.token }}
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
          # Opened issues and PRs are classified by the hosted agent; see apps/agent-weaver/README.md.
          WEAVER_MODEL: community/pollinations-ai/weaver
          PR_NUMBERS: ${{ inputs.pr_numbers }}
          ISSUE_NUMBERS: ${{ inputs.issue_numbers }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
        run: bash operations/infrastructure/project-manager/run.sh
