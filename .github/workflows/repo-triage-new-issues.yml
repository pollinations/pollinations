name: Repo / Triage new issues

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Preview triage on an existing issue without commenting or closing"
        type: number
        required: true

concurrency:
  group: issue-automation-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  triage:
    if: |
      github.event_name == 'workflow_dispatch' || (
        !endsWith(github.event.issue.user.login, '[bot]') &&
        !contains(github.event.issue.user.login, 'dependabot') &&
        !contains(github.event.issue.user.login, 'renovate'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
    steps:
      - uses: actions/checkout@v5
      - name: Fetch shipped code for evidence
        run: git fetch --depth=1 origin refs/heads/production:refs/remotes/origin/production
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Triage issue
        env:
          POLLINATIONS_TOKEN: ${{ secrets.PLN_GITHUB_POLLY_KEY }}
        run: python operations/infrastructure/project-manager/triage_new_issue.py
