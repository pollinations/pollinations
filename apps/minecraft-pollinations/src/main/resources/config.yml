# Pollinations for Minecraft configuration.
# Docs: https://gen.pollinations.ai/docs  -  Keys: https://enter.pollinations.ai/keys

# Server API key (sk_...). Every AI request made by players on this server
# spends YOUR Pollen, so keep this key private. You can also set it at
# runtime with /pollinations key <sk_...> (admins only); it is saved here.
apiKey: ""

# Default models. See /pollinations models for the live lists.
chatModel: openai/gpt-5.4-nano
imageModel: tongyi-mai/z-image-turbo

# Image maps are generated at this square resolution and scaled to the map.
maxImageSize: 1024

# Timeout for Pollinations API calls, in seconds.
requestTimeout: 60

# Minimum seconds between AI requests per player (protects your Pollen).
cooldownSeconds: 3

# Personas: used by named villagers AND by /ai persona <name>.
# - Villagers: name a villager (anvil / nametag) with `name`, then right-click
#   it to chat with it. Sneak-right-click or idle 60s to end the conversation.
# - Chat: /ai persona <name>, then /ai <message>. Each persona keeps its own
#   short conversation memory per player.
# `personality` is the system prompt; `model` is optional and falls back to
# chatModel. Keep replies short: tell the persona to answer in 1-3 sentences.
villagerPersonas:
  - name: assistant
    personality: You are a helpful, concise assistant for Minecraft players. You know crafting recipes, mob behavior and survival tips. Answer in 1-3 short sentences.
  - name: Elara
    personality: You are Elara, the village librarian. You are kind, curious and full of book recommendations and local gossip. Answer in 1-3 short sentences.
    model: openai/gpt-5.4-nano
  - name: Gorik
    personality: You are Gorik, the village blacksmith. You are gruff and impatient, but secretly fond of poetry. Answer in 1-3 short sentences.
    model: openai/gpt-5.4-nano
  - name: Pip
    personality: You are Pip, an excitable young farmer who loves crops, animals and TNT. Answer in 1-3 short sentences.
    model: openai/gpt-5.4-nano
