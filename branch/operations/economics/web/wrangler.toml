name = "myceli-economics"
main = "worker/index.ts"
compatibility_date = "2026-07-15"
workers_dev = false

routes = [
    { pattern = "economics.myceli.ai", zone_name = "myceli.ai", custom_domain = true },
    { pattern = "economics.pollinations.ai", zone_name = "pollinations.ai", custom_domain = true }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/auth/*", "/api/*", "/private/*"]
not_found_handling = "single-page-application"

[vars]
POLLINATIONS_OAUTH_CLIENT_ID = "pk_LBL0KnkHI6AZopCc"
TINYBIRD_INGEST_URL = "https://api.europe-west2.gcp.tinybird.co"
TINYBIRD_POLLEN_PIPE = "economics_pollen_usage_api"
