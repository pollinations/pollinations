<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>pollinations.app | Free static site hosting</title>
<meta name="description" content="Free hosting for static sites at your-app.pollinations.app. Publish with one command from the CLI, or from code with the SDK, the MCP server or the API.">
<link rel="canonical" href="https://pollinations.app/">
<meta property="og:type" content="website">
<meta property="og:url" content="https://pollinations.app/">
<meta property="og:site_name" content="pollinations.app">
<meta property="og:locale" content="en_US">
<meta property="og:title" content="pollinations.app | Free static site hosting">
<meta property="og:description" content="Publish a static site at your-app.pollinations.app with one command. Free for every Pollinations account.">
<meta property="og:image" content="https://pollinations.app/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="pollinations.ai logo">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:site" content="@pollinations_ai">
<meta name="twitter:image" content="https://pollinations.app/og-image.png">
<meta name="twitter:image:alt" content="pollinations.ai logo">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="pollinations.app">
<!-- The page is built from the published @pollinations/ui package, loaded
     the no-build way its README describes. Its version is pinned here and in
     the script's UI constant; bump all three together. -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@pollinations/ui@0.1.0-alpha.22/dist/styles.css">
<link rel="preload" as="script" href="https://cdn.jsdelivr.net/npm/@pollinations/ui@0.1.0-alpha.22/dist/index.browser.min.js">
<link rel="modulepreload" href="https://esm.sh/react@19.2.5">
<link rel="modulepreload" href="https://esm.sh/react-dom@19.2.5/client?deps=react@19.2.5">
<script>
    // The package's colour mode, set before paint as on pollinations.ai.
    (() => {
        let mode;
        try {
            mode = localStorage.getItem("polli-color-mode");
        } catch {}
        if (mode !== "light" && mode !== "dark") {
            mode = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        if (mode === "dark") document.documentElement.classList.add("dark");
    })();
</script>
<style>
/* The package ships no reset: apps bring Tailwind's. This is the same
   preflight pollinations.ai builds with, in the package's base layer so every
   component style still wins. Its few uncompiled --theme() font declarations
   are dropped by the browser; the body sets the font below. */
@import url("https://cdn.jsdelivr.net/npm/tailwindcss@4.3.3/preflight.css") layer(base);

/* Page layout only: colours, type and components come from the package. */
body {
    margin: 0;
    min-height: 100dvh;
    background: var(--polli-color-app-bg);
    color: var(--polli-color-text-base);
    font-family: var(--polli-font-body);
}
/* Widths and gutters follow pollinations.ai. */
#root { max-width: 1240px; margin: 0 auto; padding: 0 1.25rem; }
.bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 1rem;
    padding: 1.25rem 0;
}
.home { display: block; border-radius: 0.375rem; color: var(--polli-color-text-strong); }
.home:focus-visible { outline: 2px solid var(--polli-color-focus); outline-offset: 2px; }
.logo { width: 2rem; height: 2rem; }
.hero-copy { display: flex; flex-direction: column; gap: 1.5rem; }
.hero-copy p { text-wrap: balance; }
.bee { width: 7.5rem; height: auto; rotate: -6deg; user-select: none; }
.row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; }
.sheet { display: flex; flex-direction: column; gap: 3.5rem; padding: 2.5rem 1.25rem; }
.sheet section { display: flex; flex-direction: column; gap: 1.25rem; }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 1rem; }
.card-head { display: flex; align-items: center; gap: 0.75rem; }
.address {
    display: inline-flex;
    align-self: flex-start;
    align-items: center;
    gap: 0.625rem;
    min-height: 3rem;
    padding: 0 1.125rem;
    border-radius: 0.75rem;
    background: var(--polli-color-surface-opaque);
    color: var(--polli-color-text-base);
    font-size: 1.0625rem;
    font-weight: 500;
}
.address svg { width: 1rem; height: 1rem; flex-shrink: 0; color: var(--polli-color-text-muted); }
/* Brand colours stay bright in dark mode, like a real text selection. */
.address mark {
    padding: 0.125rem 0.1875rem;
    border-radius: 0.25rem;
    background: var(--polli-color-brand-accent);
    color: var(--polli-color-brand-dark);
}
code.inline { font-family: var(--polli-font-mono); font-size: 0.9em; color: var(--polli-color-text-strong); }
footer {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    gap: 0.5rem 1.5rem;
    padding: 2rem 0 3rem;
    font-size: 0.875rem;
    color: var(--polli-color-text-muted);
}
footer nav { display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem; }
/* Phones: the page card runs full width, as on pollinations.ai and enter. */
@media (max-width: 639px) {
    .sheet { margin-inline: -1.25rem; }
    /* The title is one word that cannot wrap: about 10 em wide. */
    .hero h1 { font-size: min(2.25rem, calc((100vw - 2.5rem) / 10)); }
}
@media (min-width: 640px) {
    #root { padding-inline: 1.5rem; }
    .sheet { gap: 4.5rem; padding: 4rem 2rem; }
}
@media (min-width: 768px) {
    .sheet { padding: 4.5rem 4.5rem; }
}
/* Polli sits beside the copy once the one-word title leaves room for her. */
@media (min-width: 1200px) {
    .sheet .hero { flex-direction: row; align-items: center; justify-content: space-between; }
    .bee { order: 1; width: 13.75rem; flex-shrink: 0; }
}
</style>
</head>
<body>
<div id="root"></div>
<noscript>Read about pollinations.app hosting in the <a href="https://gen.pollinations.ai/docs#tag/sites">docs</a>.</noscript>
<script type="module">
import React from "https://esm.sh/react@19.2.5";
import { createRoot } from "https://esm.sh/react-dom@19.2.5/client?deps=react@19.2.5";
import * as ReactDOM from "https://esm.sh/react-dom@19.2.5?deps=react@19.2.5";

const UI = "https://cdn.jsdelivr.net/npm/@pollinations/ui@0.1.0-alpha.22/dist";

// The package's browser bundle reads React from these globals.
window.React = React;
window.ReactDOM = ReactDOM;
await new Promise((resolve, reject) => {
    const script = document.createElement("script");
    script.src = `${UI}/index.browser.min.js`;
    script.onload = resolve;
    script.onerror = reject;
    document.head.append(script);
});

const {
    AppIcon, BookIcon, BrandMark, CloudUploadIcon, CodeBlock, CodeIcon,
    ColorModeToggle, ContentHeader, ExternalLinkButton, GlobeIcon, Heading, IconTile,
    InlineLink, LinkCard, LockIcon, LogInIcon, McpIcon, Surface, TerminalIcon, Text,
} = window.PollinationsUI;
const h = React.createElement;
const code = (text) => h("code", { className: "inline" }, text);

const DOCS = "https://gen.pollinations.ai/docs";
const CLI_URL = "https://www.npmjs.com/package/@pollinations/cli";
const DASHBOARD = "https://enter.pollinations.ai";

// The address the commands below publish to, as a browser bar shows it; the
// name is marked like selected text: the part that is yours.
const ADDRESS = h("p", { className: "address" },
    h(LockIcon, { "aria-hidden": "true" }),
    h("span", { className: "polli:sr-only" }, "Each site is served at "),
    h("span", null, h("mark", null, "my-app"), ".pollinations.app"));

const PUBLISH = `npm install -g @pollinations/cli
polli auth login
polli sites deploy ./dist --name my-app
# → https://my-app.pollinations.app`;

// Card colours follow the matching cards on pollinations.ai.
const FROM_CODE = [
    {
        title: "SDK",
        body: [code("deploySite"), " in ", code("@pollinations/sdk")],
        href: "https://www.npmjs.com/package/@pollinations/sdk",
        icon: CodeIcon,
        color: "var(--polli-color-modality-image)",
    },
    {
        title: "MCP server",
        body: ["The ", code("deploySite"), " tool of the Pollinations MCP server"],
        href: `${DOCS}#tag/mcp-servers`,
        icon: McpIcon,
        color: "var(--polli-color-modality-video)",
    },
    {
        title: "API",
        body: [code("PUT /account/sites/{name}")],
        href: `${DOCS}#tag/account`,
        icon: GlobeIcon,
        color: "var(--polli-color-modality-text)",
    },
];

const LIMITS = [
    {
        title: "5 sites per account",
        body: ["200 MB and 1,000 files per site."],
        icon: CloudUploadIcon,
    },
    {
        title: "Single-page apps work",
        body: ["A folder of static files with an ", code("index.html"), ". Unknown paths serve it."],
        icon: AppIcon,
    },
    {
        title: "Sites are public",
        body: [
            "Never put an API key in one. Let visitors sign in with their own Pollen through ",
            h(InlineLink, { key: "wallets", href: `${DOCS}#tag/connect-user-wallets` }, "Connect User Wallets"),
            ".",
        ],
        icon: LockIcon,
        color: "var(--polli-color-warning-text)",
    },
];

// Laid out like the feature cards on pollinations.ai.
function Card({ title, body, icon, color }) {
    return [
        h("div", { key: "head", className: "card-head" },
            h(IconTile, { icon, color }),
            h(Heading, { as: "h3", size: "card" }, title)),
        h(Text, { key: "body", size: "sm" }, ...body),
    ];
}

function Page() {
    return [
        h("header", { key: "header", className: "bar" },
            h("a", { className: "home", href: "https://pollinations.ai", "aria-label": "pollinations.ai" },
                h(BrandMark, { className: "logo" })),
            h("div", { className: "row" },
                h(ExternalLinkButton, {
                    href: DASHBOARD,
                    external: false,
                    intent: "surface",
                    icon: h(LogInIcon, { className: "polli:h-4 polli:w-4" }),
                }, "Dashboard"),
                h(ColorModeToggle))),
        h(Surface, { key: "main", as: "main", variant: "panel", className: "sheet" },
            h("section", { className: "hero" },
                h("img", { className: "bee", src: `${UI}/brand/polli/polli.png`, alt: "", width: 540, height: 527 }),
                h("div", { className: "hero-copy" },
                    h(ContentHeader, {
                        variant: "page",
                        eyebrow: "Static site hosting",
                        title: "pollinations.app",
                        subtitle: "Free hosting for static sites, for anyone with a Pollinations account.",
                    }),
                    ADDRESS,
                    h("div", { className: "row" },
                        h(ExternalLinkButton, {
                            href: `${DOCS}#tag/sites`,
                            size: "lg",
                            icon: h(BookIcon, { className: "polli:h-4 polli:w-4" }),
                        }, "Docs"),
                        h(ExternalLinkButton, {
                            href: CLI_URL,
                            size: "lg",
                            intent: "neutral",
                            icon: h(TerminalIcon, { className: "polli:h-4 polli:w-4" }),
                        }, "CLI")))),
            h("section", null,
                h(ContentHeader, { eyebrow: null, title: "Publish", subtitle: "From your terminal:" }),
                h(CodeBlock, { code: PUBLISH, language: "Terminal" }),
                h(Text, { tone: "strong", weight: "semibold" }, "From code or an agent:"),
                h("ul", { className: "cards" },
                    FROM_CODE.map((item) =>
                        h("li", { key: item.title },
                            h(LinkCard, { href: item.href }, Card(item)))))),
            h("section", null,
                h(ContentHeader, { eyebrow: null, title: "Limits" }),
                h("ul", { className: "cards" },
                    LIMITS.map((item) =>
                        h("li", { key: item.title },
                            h(Surface, { className: "polli:flex polli:h-full polli:flex-col polli:gap-2 polli:p-5" }, Card(item))))))),
        h("footer", { key: "footer" },
            h("nav", { "aria-label": "Links" },
                [["pollinations.ai", "https://pollinations.ai"], ["Docs", `${DOCS}#tag/sites`], ["CLI", CLI_URL], ["Dashboard", DASHBOARD, false]].map(([label, href, external]) =>
                    h(InlineLink, { key: label, href, external, tone: "quiet", size: "footer" }, label))),
            h("span", null, `© ${new Date().getFullYear()} Myceli.AI OÜ`)),
    ];
}

createRoot(document.getElementById("root")).render(h(Page));
</script>
</body>
</html>
