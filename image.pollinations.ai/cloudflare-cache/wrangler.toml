name = "pollinations-image-cache"
main = "src/index.ts"
compatibility_date = "2025-08-01"
# The Weft SDK uses Buffer
compatibility_flags = ["nodejs_compat"]
# The account_id will be automatically read from the CLOUDFLARE_ACCOUNT_ID environment variable
# Only the custom domains below serve this Worker
workers_dev = false
preview_urls = false

# Custom domains, set up as in gen: myceli.ai first, pollinations.ai on top
[[routes]]
pattern = "image.myceli.ai"
zone_name = "myceli.ai"
custom_domain = true

[[routes]]
pattern = "image.pollinations.ai"
zone_name = "pollinations.ai"
custom_domain = true

# R2 bucket for image storage
[[r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "pollinations-images-legacy"

# Image generation, billed to the GEN_API_KEY bridge key
[[services]]
binding = "GEN"
service = "pollinations-gen-production"

# One free-generation slot per client IP (shared/ip-slot.js)
[[durable_objects.bindings]]
name = "IP_SLOT"
class_name = "IpSlot"

# The public /feed's listeners (shared/feed-hub.js), one object
[[durable_objects.bindings]]
name = "FEED_HUB"
class_name = "FeedHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["IpSlot", "FeedHub"]

# The paywall art (shared/assets/weft-paywall.webp) and the logo lockups
# (assets/*.png) are imported as bytes
[[rules]]
type = "Data"
globs = ["**/*.webp", "**/*.png"]
fallthrough = true

# Environment variables
[vars]
ORIGIN_HOST = "image-origin.pollinations.ai"
# Percent of cache misses served by src/origin.ts; the rest go to the VM
ADAPTER_SHARE = "10"
# x402 paywall, as on the VM; WEFT_SELLER_API_KEY is a secret. Without all
# four values the paywall is off and rate-limited requests wait instead
WEFT_PAY_TO = "0xF04da999947454410d2Dec7eE01cD13f7FaD6fbE"
WEFT_NETWORK = "eip155:8453"
WEFT_FACILITATOR_URL = "https://x402.weft.network"

[secrets]
required = ["GEN_API_KEY"]

# Increase limits for long-running operations
# This requires a paid Workers Unbound plan
[limits]
cpu_ms = 30000  # 30 seconds CPU time (max for Workers Unbound)

# Configure logging
[observability]
enabled = false      # turns Workers Logs off completely

[observability.logs]
invocation_logs = false

# Local tests only (vitest), never deployed. Migrations are inherited.
[env.test]
routes = [] # keep the production custom domains out of this environment

[env.test.vars]
ORIGIN_HOST = "origin.invalid" # tests that take the VM path stub its fetch
ADAPTER_SHARE = "100"
WEFT_PAY_TO = "0xF04da999947454410d2Dec7eE01cD13f7FaD6fbE"
WEFT_NETWORK = "eip155:8453"
WEFT_FACILITATOR_URL = "https://x402.weft.network"

# Local runs load only this key from .dev.vars.test; vitest.config.ts binds test values
[env.test.secrets]
required = ["GEN_API_KEY"]

[[env.test.r2_buckets]]
binding = "IMAGE_BUCKET"
bucket_name = "pollinations-images-legacy-test"

# Local gen's dev name; the tests replace it with fixed responses
[[env.test.services]]
binding = "GEN"
service = "pollinations-gen"

[[env.test.durable_objects.bindings]]
name = "IP_SLOT"
class_name = "IpSlot"

[[env.test.durable_objects.bindings]]
name = "FEED_HUB"
class_name = "FeedHub"
