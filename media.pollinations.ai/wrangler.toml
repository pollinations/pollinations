name = "pollinations-media"
main = "src/index.ts"
compatibility_date = "2025-11-12"
compatibility_flags = ["nodejs_compat"]
account_id = "b6ec751c0862027ba269faf7029b2501"

# Local development server
[env.development]
name = "pollinations-media-dev"

[env.development.vars]
MAX_FILE_SIZE = "419430400"  # 400 MiB in bytes

[[env.development.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pollinations-media-dev"

# Permanent uploads (`p_` ids). This bucket has no lifecycle rule.
[[env.development.r2_buckets]]
binding = "PERMANENT_BUCKET"
bucket_name = "pollinations-media-permanent-dev"

[[env.development.d1_databases]]
binding = "DB"
database_name = "development-pollinations-enter-db"
database_id = "2b844596-9890-4a2e-9da9-6c65681fa24d"
migrations_dir = "../enter.pollinations.ai/drizzle"

# Private staging Worker used through service bindings.
[env.staging]
name = "pollinations-media-staging"
workers_dev = false

[env.staging.vars]
MAX_FILE_SIZE = "419430400"

[[env.staging.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pollinations-media"

# Permanent uploads (`p_` ids). This bucket has no lifecycle rule.
[[env.staging.r2_buckets]]
binding = "PERMANENT_BUCKET"
bucket_name = "pollinations-media-permanent"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "staging-pollinations-enter-db"
database_id = "2cb1cf1a-a18a-4cad-a4bb-be64e3c0e39f"
migrations_dir = "../enter.pollinations.ai/drizzle"

# Production environment
# Single-request 400 MiB uploads require the pollinations.ai zone's maximum
# upload setting to be at least 425 MB.
[env.production]
name = "pollinations-media-prod"

[env.production.vars]
MAX_FILE_SIZE = "419430400"  # 400 MiB in bytes

[[env.production.routes]]
pattern = "media.myceli.ai"
zone_name = "myceli.ai"
custom_domain = true

[[env.production.routes]]
pattern = "media.pollinations.ai"
zone_name = "pollinations.ai"
custom_domain = true

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pollinations-media"

# Permanent uploads (`p_` ids). This bucket has no lifecycle rule.
[[env.production.r2_buckets]]
binding = "PERMANENT_BUCKET"
bucket_name = "pollinations-media-permanent"

[[env.production.d1_databases]]
remote = true
binding = "DB"
database_name = "production-pollinations-enter-db"
database_id = "fc771b05-4e24-48bf-980c-d09f21279bd1"
migrations_dir = "../enter.pollinations.ai/drizzle"

[vars]
MAX_FILE_SIZE = "419430400"  # 400 MiB in bytes

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "pollinations-media"

# Permanent uploads (`p_` ids). This bucket has no lifecycle rule.
[[r2_buckets]]
binding = "PERMANENT_BUCKET"
bucket_name = "pollinations-media-permanent"

[[d1_databases]]
binding = "DB"
database_name = "development-pollinations-enter-db"
database_id = "2b844596-9890-4a2e-9da9-6c65681fa24d"
migrations_dir = "../enter.pollinations.ai/drizzle"

# Dev server settings
[dev]
port = 8790
local_protocol = "http"
