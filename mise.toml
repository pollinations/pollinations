[tools]
node = "24"
python = "3.12"
sops = "3.13.3"
age = "1.3.1"
biome = "2.5.11"

[tasks.dev]
run = "npm run dev"
description = "Start local dev servers (enter + gen)"

[tasks.test]
run = "npm run test"
description = "Run all tests"

[tasks.lint]
run = "biome check ."
description = "Lint and format check"

[tasks.lint-fix]
run = "biome check --write --unsafe ."
description = "Auto-fix lint and format issues"
