name = "myceli-economics"
main = "worker/index.ts"
compatibility_date = "2026-07-15"
workers_dev = false

routes = [
    { pattern = "economics.myceli.ai", zone_name = "myceli.ai", custom_domain = true },
    { pattern = "economics.pollinations.ai", zone_name = "pollinations.ai", custom_domain = true }
]

[assets]
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[vars]
TINYBIRD_API = "https://api.europe-west2.gcp.tinybird.co"
TINYBIRD_POLLEN_PIPE = "economics_pollen_usage_api"

# Secrets:
# - POLLINATIONS_AUTH_ALLOWED_EMAILS
# - POLLINATIONS_AUTH_SESSION_SECRET
# - POLLINATIONS_OAUTH_CLIENT_ID
# - TINYBIRD_ECONOMICS_READ_TOKEN
