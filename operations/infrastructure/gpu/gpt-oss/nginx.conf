# Capacity gate in front of vLLM: at most 48 requests in flight (vLLM runs 32
# and queues the rest). Beyond that, callers get an instant 503 instead of a
# queue that grows until every request times out.
worker_processes 1;
pid /run/gpt-oss-nginx.pid;
error_log /root/nginx-error.log warn;

events {
    worker_connections 1024;
}

http {
    access_log off;

    # One shared key, so the limit counts every connection
    map $host $gpu {
        default gpu;
    }
    limit_conn_zone $gpu zone=gpu:1m;

    server {
        listen 127.0.0.1:10010;

        location / {
            limit_conn gpu 48;
            limit_conn_status 503;
            error_page 503 = @busy;

            proxy_pass http://127.0.0.1:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_read_timeout 600s;
            client_max_body_size 20m;
        }

        location @busy {
            default_type application/json;
            add_header Retry-After 5 always;
            return 503 '{"error":{"message":"The GPU is busy, retry shortly","type":"overloaded"}}';
        }
    }
}
