<!doctype html>
<html lang="en" class="polli-ui-root">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <!-- Set color mode before first paint to avoid a flash. Source of truth
             after mount: @pollinations/ui ColorModeToggle (STORAGE_KEY must match). -->
        <script>
            (() => {
                try {
                    let mode = localStorage.getItem("polli-color-mode");
                    if (mode !== "light" && mode !== "dark") {
                        mode = matchMedia("(prefers-color-scheme: dark)").matches
                            ? "dark"
                            : "light";
                    }
                    if (mode === "dark") document.documentElement.classList.add("dark");
                } catch {
                    /* ignore storage / matchMedia failures */
                }
            })();
        </script>

        <meta name="description" content="Weekly KPI dashboard for pollinations.ai" />
        <meta name="robots" content="noindex" />
        <title>KPI | pollinations.ai</title>

        <link rel="icon" type="image/x-icon" href="/favicon.ico" />
        <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
        <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    </head>
    <body class="bg-app-bg">
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
