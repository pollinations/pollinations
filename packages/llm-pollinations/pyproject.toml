[project]
name = "llm-pollinations"
version = "0.1.0"
description = "LLM plugin for text models hosted by Pollinations"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "llm",
    "httpx",
]

[project.entry-points.llm]
pollinations = "llm_pollinations"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"
