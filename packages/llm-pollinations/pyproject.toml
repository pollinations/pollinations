[project]
name = "llm-pollinations"
version = "0.1.0"
description = "LLM plugin for models hosted by Pollinations"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [{name = "Pollinations community"}]
dependencies = ["llm>=0.35", "httpx"]

[project.urls]
Homepage = "https://github.com/pollinations/pollinations"
Issues = "https://github.com/pollinations/pollinations/issues/14660"

[project.entry-points.llm]
pollinations = "llm_pollinations"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest"]
