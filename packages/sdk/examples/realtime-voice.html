<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pollinations realtime voice</title>
        <style>
            :root { color-scheme: dark; font-family: system-ui, sans-serif; }
            body { margin: 0; padding: 2rem; background: #111; color: #eee; }
            main { max-width: 44rem; margin: 0 auto; display: grid; gap: 1rem; }
            h1 { font-size: 1.25rem; margin: 0; }
            p { margin: 0; font-size: 0.9rem; color: #aaa; }
            input,
            button {
                font: inherit;
                padding: 0.6rem 0.8rem;
                border-radius: 0.5rem;
                border: 1px solid #333;
                background: #1b1b1b;
                color: inherit;
            }
            button:disabled { opacity: 0.5; }
            .row { display: flex; gap: 0.5rem; }
            .row input { flex: 1; }
            #status { font-size: 0.85rem; color: #9ae6b4; }
            #transcript {
                min-height: 4rem;
                font-size: 0.95rem;
                white-space: pre-wrap;
            }
            #log {
                font: 0.8rem/1.5 ui-monospace, monospace;
                background: #1b1b1b;
                border: 1px solid #333;
                border-radius: 0.5rem;
                padding: 0.8rem;
                height: 12rem;
                overflow: auto;
                white-space: pre-wrap;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Pollinations realtime voice</h1>
            <p>
                Paste a secret key (<code>sk_...</code>) and press Start. The
                page streams your microphone as PCM16 and plays the model's
                reply. Talk to it, it answers out loud.
            </p>
            <div class="row">
                <input
                    id="key"
                    type="password"
                    placeholder="sk_..."
                    autocomplete="off"
                />
                <button id="start" type="button">Start</button>
                <button id="stop" type="button" disabled>Stop</button>
            </div>
            <div id="status">idle</div>
            <div id="transcript"></div>
            <pre id="log"></pre>
        </main>

        <!-- biome-ignore lint/a11y/useMediaCaption: the transcript is shown as text under the player -->
        <audio id="speaker" autoplay></audio>

        <!-- The browser bundle of the SDK. To try this page against the source
             in this repository, run `npm run build` in packages/sdk first; the
             bundle is then at ../dist/index.browser.min.js. -->
        <script src="../dist/index.browser.min.js"></script>
        <script>
            const { base64ToPcm16, connectRealtime, pcm16ToBase64 } =
                window.Pollinations;

            const keyInput = document.querySelector("#key");
            const startButton = document.querySelector("#start");
            const stopButton = document.querySelector("#stop");
            const statusLine = document.querySelector("#status");
            const transcriptLine = document.querySelector("#transcript");
            const log = document.querySelector("#log");
            const speaker = document.querySelector("#speaker");

            // The realtime models take and return 24 kHz mono PCM16.
            const SAMPLE_RATE = 24000;
            // Audio goes out in 100 ms chunks, so the socket carries ten
            // messages a second instead of one per audio frame.
            const CHUNK_SAMPLES = SAMPLE_RATE / 10;

            const logEvent = (text) => {
                log.textContent += `${text}\n`;
                log.scrollTop = log.scrollHeight;
            };

            let session = null;
            let media = null;
            let micContext = null;
            let playContext = null;
            let playDestination = null;
            // The next chunk starts where the last one ends, so the reply has
            // no gaps between the chunks.
            let playAt = 0;

            // Sends microphone frames to the model as PCM16.
            function micWorklet() {
                const code = `
                    class MicProcessor extends AudioWorkletProcessor {
                        process(inputs) {
                            const channel = inputs[0] && inputs[0][0];
                            if (channel) this.port.postMessage(channel.slice(0));
                            return true;
                        }
                    }
                    registerProcessor("mic-processor", MicProcessor);
                `;
                return URL.createObjectURL(
                    new Blob([code], { type: "text/javascript" }),
                );
            }

            // Plays one chunk of the model's audio.
            function playAudio(base64) {
                const samples = base64ToPcm16(base64);
                const buffer = playContext.createBuffer(
                    1,
                    samples.length,
                    SAMPLE_RATE,
                );
                buffer.copyToChannel(samples, 0);
                const source = playContext.createBufferSource();
                source.buffer = buffer;
                source.connect(playDestination);
                playAt = Math.max(playAt, playContext.currentTime);
                source.start(playAt);
                playAt += buffer.duration;
            }

            function handleEvent(event) {
                if (event.type === "response.output_audio.delta" && event.delta) {
                    playAudio(event.delta);
                } else if (
                    event.type === "response.output_audio_transcript.delta" &&
                    event.delta
                ) {
                    transcriptLine.textContent += event.delta;
                } else if (event.type === "response.done") {
                    transcriptLine.textContent += "\n";
                } else if (event.type === "error") {
                    logEvent(`error: ${event.error?.message ?? "unknown"}`);
                }
            }

            async function start() {
                const apiKey = keyInput.value.trim();
                if (!apiKey) return;

                playContext = new AudioContext({ sampleRate: SAMPLE_RATE });
                // The model's voice plays through an <audio> element: the
                // browser only takes the element's output as the reference for
                // echo cancellation, so the microphone does not hear the model
                // and the model does not answer itself.
                playDestination = playContext.createMediaStreamDestination();
                speaker.srcObject = playDestination.stream;

                session = await connectRealtime({
                    apiKey,
                    session: {
                        type: "realtime",
                        output_modalities: ["audio"],
                        instructions:
                            "You are a concise voice assistant. Answer in one or two sentences.",
                        audio: {
                            input: {
                                format: { type: "audio/pcm", rate: SAMPLE_RATE },
                                turn_detection: { type: "server_vad" },
                            },
                            output: {
                                format: { type: "audio/pcm", rate: SAMPLE_RATE },
                                voice: "alloy",
                            },
                        },
                    },
                });
                session.on("*", handleEvent);
                session.closed.then(({ code, reason }) => {
                    logEvent(`session closed (${code}) ${reason}`.trim());
                    if (session) stop();
                });
                statusLine.textContent = "connected";

                media = await navigator.mediaDevices.getUserMedia({
                    audio: true,
                });
                // The context resamples the microphone to the rate the model
                // expects, so the frames need no conversion beyond PCM16.
                micContext = new AudioContext({ sampleRate: SAMPLE_RATE });
                await micContext.audioWorklet.addModule(micWorklet());
                const source = micContext.createMediaStreamSource(media);
                const processor = new AudioWorkletNode(
                    micContext,
                    "mic-processor",
                );
                let pending = new Float32Array(0);
                processor.port.onmessage = (message) => {
                    const chunk = message.data;
                    const merged = new Float32Array(pending.length + chunk.length);
                    merged.set(pending);
                    merged.set(chunk, pending.length);
                    pending = merged;
                    if (pending.length < CHUNK_SAMPLES) return;
                    const frame = pending;
                    pending = new Float32Array(0);
                    try {
                        session?.send({
                            type: "input_audio_buffer.append",
                            audio: pcm16ToBase64(frame),
                        });
                    } catch {
                        // The session closed while a frame was in flight.
                    }
                };
                source.connect(processor);
                // The microphone must not play back, but the worklet only runs
                // when it reaches the destination.
                const silent = micContext.createGain();
                silent.gain.value = 0;
                processor.connect(silent).connect(micContext.destination);

                startButton.disabled = true;
                stopButton.disabled = false;
                logEvent("session started");
            }

            function stop() {
                session?.close();
                session = null;
                for (const track of media?.getTracks() ?? []) track.stop();
                media = null;
                micContext?.close();
                playContext?.close();
                micContext = null;
                playContext = null;
                startButton.disabled = false;
                stopButton.disabled = true;
                statusLine.textContent = "idle";
                logEvent("session stopped");
            }

            startButton.addEventListener("click", () => {
                start().catch((error) => {
                    statusLine.textContent = `error: ${error.message}`;
                    logEvent(`error: ${error.message}`);
                    stop();
                });
            });
            stopButton.addEventListener("click", stop);
        </script>
    </body>
</html>
