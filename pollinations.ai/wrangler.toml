name = "pollinations-ai"
compatibility_date = "2025-11-01"
main = "src/worker.ts"
account_id = "b6ec751c0862027ba269faf7029b2501"

[assets]
directory = "dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Run HTML routes through the SEO worker while serving asset directories
# directly from Cloudflare's static asset layer.
run_worker_first = ["/*", "!/assets/*", "!/heroes/*", "!/tool-scenes/*", "!/app-art/*", "!/supporters/*", "!/data/*", "!/legal/*"]

# Public hostnames are attached directly in the Myceli account.
[env.production]

[[env.production.routes]]
pattern = "pollinations.myceli.ai"
zone_name = "myceli.ai"
custom_domain = true

[[env.production.routes]]
pattern = "pollinations.ai"
zone_name = "pollinations.ai"
custom_domain = true

[[env.production.routes]]
pattern = "www.pollinations.ai"
zone_name = "pollinations.ai"
custom_domain = true

[env.staging]

[[env.staging.routes]]
pattern = "staging.pollinations.myceli.ai"
zone_name = "myceli.ai"
custom_domain = true

[[env.staging.routes]]
pattern = "staging.myceli.ai"
zone_name = "myceli.ai"
custom_domain = true

[[env.staging.routes]]
pattern = "staging.pollinations.ai"
zone_name = "pollinations.ai"
custom_domain = true
